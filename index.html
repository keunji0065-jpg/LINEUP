<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <!-- 화면 확대(줌) 허용하도록 maximum-scale 및 user-scalable 제한 해제 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>엠버언니 라이브 방송 제품</title>
    <!-- 디자인(Tailwind CSS) -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & Babel (crossorigin 속성 제거로 로드 차단 에러 해결) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>
    
    <!-- Firebase SDK (호환 모드) -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <!-- 폰트 및 커스텀 스타일 -->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;1,600&display=swap');
        
        body { 
            font-family: 'Pretendard', sans-serif; 
            background-color: #f8fafc; 
            color: #0f172a; 
        }
        .font-serif { font-family: 'Playfair Display', serif; }
        .break-keep { word-break: keep-all; }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #cbd5e1; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in { animation: fadeIn 0.3s ease-out forwards; }

        /* 크롭퍼 캔버스 스타일 */
        .crop-canvas-container {
            width: 100%;
            aspect-ratio: 1 / 1;
            background-color: #0f172a;
            position: relative;
            overflow: hidden;
            touch-action: none;
            cursor: grab;
            border-radius: 8px;
        }
        .crop-canvas-container:active { cursor: grabbing; }
        .crop-canvas-container canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body class="antialiased h-[100dvh] flex flex-col items-center justify-center">

    <!-- 초기 로딩 화면 방어막 -->
    <div id="root" class="w-full h-full max-w-md bg-white shadow-2xl relative overflow-hidden flex flex-col">
        <div style="display:flex; height:100%; align-items:center; justify-content:center; color:#9ca3af; font-size:14px;">
            라인업을 불러오는 중입니다...
        </div>
    </div>

    <!-- FIREBASE 설정 영역 -->
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDgdH34cDnp2S9akHfFLYBSpHzzamHFuoc",
            authDomain: "my-live-shop.firebaseapp.com",
            databaseURL: "https://my-live-shop-default-rtdb.firebaseio.com",
            projectId: "my-live-shop",
            storageBucket: "my-live-shop.firebasestorage.app",
            messagingSenderId: "598748133843",
            appId: "1:598748133843:web:17c7d83321fc191f85d726",
            measurementId: "G-9EX0P6H2Y7"
        };
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.database();
    </script>

    <script type="text/babel">
        const { useState, useEffect, useRef, useCallback } = React;

        // 특수문자 제거 및 안전한 Firebase Key 생성
        const getSafeKey = (name) => name.replace(/[.#$\[\]]/g, '_');

        class ErrorBoundary extends React.Component {
            constructor(props) { super(props); this.state = { hasError: false, errorMessage: '' }; }
            static getDerivedStateFromError(error) { return { hasError: true, errorMessage: error.toString() }; }
            componentDidCatch(error, errorInfo) { console.error("오류 발생:", error, errorInfo); }
            render() {
                if (this.state.hasError) {
                    return (
                        <div className="flex flex-col items-center justify-center min-h-screen bg-slate-50 text-center px-5 w-full max-w-md mx-auto">
                            <div className="text-4xl mb-4">⚠️</div>
                            <h2 className="text-lg font-bold mb-2">일시적인 오류가 발생했습니다.</h2>
                            <p className="text-xs text-red-500 mb-6 px-4 break-all">{this.state.errorMessage}</p>
                            <button onClick={() => { localStorage.removeItem('ember_cart_v3'); window.location.reload(); }} className="px-6 py-3 bg-black text-white text-sm font-bold tracking-widest uppercase rounded">새로고침 및 캐시 초기화</button>
                        </div>
                    );
                }
                return this.props.children;
            }
        }

        const SearchIcon = ({ size = 18 }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        );

        // ==========================================
        // 1:1 사진 등록 (크롭퍼) 모달 - 드래그앤드롭/클릭 파일업로드 지원 + 1080px 고화질 저장
        // ==========================================
        const CropperModal = ({ product, onClose, onSave }) => {
            const canvasRef = useRef(null);
            const fileInputRef = useRef(null);
            const [imageObj, setImageObj] = useState(null);
            const [scale, setScale] = useState(1);
            
            const pan = useRef({ x: 0, y: 0 });
            const isDragging = useRef(false);
            const dragStart = useRef({ x: 0, y: 0 });

            const loadImageToCanvas = (src) => {
                const img = new Image();
                img.onload = () => {
                    setImageObj(img);
                    const cSize = 400;
                    const aspect = img.width / img.height;
                    let initialScale = aspect > 1 ? cSize / img.height : cSize / img.width;
                    setScale(initialScale);
                    pan.current = { x: (cSize - img.width * initialScale) / 2, y: (cSize - img.height * initialScale) / 2 };
                    draw();
                };
                img.src = src;
            };

            const handleFileChange = (e) => {
                const file = e.target.files?.[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (evt) => loadImageToCanvas(evt.target.result);
                reader.readAsDataURL(file);
            };

            useEffect(() => {
                const handlePaste = (e) => {
                    const items = (e.clipboardData || e.originalEvent.clipboardData).items;
                    let pasted = false;
                    for (const item of items) {
                        if (item.type.indexOf('image') !== -1) {
                            const blob = item.getAsFile();
                            const reader = new FileReader();
                            reader.onload = (evt) => loadImageToCanvas(evt.target.result);
                            reader.readAsDataURL(blob);
                            e.preventDefault();
                            pasted = true;
                            break;
                        }
                    }
                    if (!pasted && items.length > 0 && items[0].type === 'text/plain') {
                        alert("사진 파일이 아닌 텍스트가 클립보드에 있습니다.\n엑셀에서 사진 복사가 안될 경우, 화면 캡처(Win+Shift+S)를 사용하시거나 파일로 직접 업로드해주세요!");
                    }
                };
                window.addEventListener('paste', handlePaste);
                return () => window.removeEventListener('paste', handlePaste);
            }, []);

            const draw = useCallback(() => {
                const canvas = canvasRef.current;
                if (!canvas || !imageObj) return;
                const ctx = canvas.getContext('2d');
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.drawImage(imageObj, pan.current.x, pan.current.y, imageObj.width * scale, imageObj.height * scale);
            }, [imageObj, scale]);

            useEffect(() => { draw(); }, [draw, scale]);

            const handleMouseDown = (e) => { if (!imageObj) return; isDragging.current = true; dragStart.current = { x: e.clientX - pan.current.x, y: e.clientY - pan.current.y }; };
            const handleMouseMove = (e) => { if (!isDragging.current) return; pan.current = { x: e.clientX - dragStart.current.x, y: e.clientY - dragStart.current.y }; draw(); };
            const handleMouseUp = () => { isDragging.current = false; };
            
            const handleWheel = (e) => {
                if (!imageObj) return;
                const zoomFactor = e.deltaY < 0 ? 1.05 : 0.95;
                setScale(prev => Math.min(Math.max(prev * zoomFactor, 0.2), 5));
            };

            const handleDrop = (e) => {
                e.preventDefault();
                const file = e.dataTransfer.files?.[0];
                if (file && file.type.startsWith('image/')) {
                    const reader = new FileReader();
                    reader.onload = (evt) => loadImageToCanvas(evt.target.result);
                    reader.readAsDataURL(file);
                }
            };
            const handleDragOver = (e) => e.preventDefault();

            const handleSave = () => {
                if (!imageObj) return alert('이미지를 먼저 업로드하거나 붙여넣어주세요.');
                const exportCanvas = document.createElement('canvas');
                // 해상도를 1080x1080 (고화질)로 대폭 상향
                exportCanvas.width = 1080; exportCanvas.height = 1080;
                const ctx = exportCanvas.getContext('2d');
                const ratio = 1080 / 400; 
                ctx.drawImage(imageObj, pan.current.x * ratio, pan.current.y * ratio, imageObj.width * scale * ratio, imageObj.height * scale * ratio);
                // 화질 95% 유지
                onSave(product.id, exportCanvas.toDataURL('image/jpeg', 0.95));
            };

            return (
                <div className="fixed inset-0 z-[100] flex items-center justify-center bg-slate-900/80 backdrop-blur-sm p-4 animate-fade-in">
                    <div className="bg-white max-w-sm w-full p-5 shadow-2xl rounded-xl flex flex-col">
                        <div className="flex justify-between items-center mb-3">
                            <h3 className="font-bold text-base">사진 등록: {product.name}</h3>
                            <button onClick={onClose} className="text-2xl text-slate-400 hover:text-black">&times;</button>
                        </div>
                        <div className="text-[11px] text-slate-500 mb-2">캡처 후 <b>Ctrl+V</b> 붙여넣기, 또는 박스를 클릭해 사진 선택</div>
                        
                        <input type="file" ref={fileInputRef} onChange={handleFileChange} accept="image/*" className="hidden" />
                        
                        <div className="crop-canvas-container" 
                            onMouseDown={handleMouseDown} onMouseMove={handleMouseMove} onMouseUp={handleMouseUp} onMouseLeave={handleMouseUp} onWheel={handleWheel}
                            onDrop={handleDrop} onDragOver={handleDragOver}
                            onClick={() => !imageObj && fileInputRef.current?.click()}
                        >
                            <canvas ref={canvasRef} width={400} height={400}></canvas>
                            {!imageObj && (
                                <div className="absolute inset-0 flex flex-col items-center justify-center text-slate-400 hover:bg-slate-800 transition-colors pointer-events-none">
                                    <div className="text-3xl mb-2">📸</div>
                                    <p className="text-xs font-bold text-center">클릭하여 사진 파일 찾기<br/>또는 캡처본(Ctrl+V) 붙여넣기</p>
                                </div>
                            )}
                        </div>
                        <button onClick={handleSave} className="mt-4 w-full py-3 bg-black text-white font-bold tracking-widest text-sm rounded-lg hover:bg-slate-800 transition shadow-md">
                            이 구획으로 사진 저장
                        </button>
                    </div>
                </div>
            );
        };

        function App() {
          const [groupedProducts, setGroupedProducts] = useState([]); 
          const [firebaseData, setFirebaseData] = useState({});
          
          const [searchTerm, setSearchTerm] = useState("");
          const [toastMessage, setToastMessage] = useState("");
          const [isLoading, setIsLoading] = useState(true);
          const [selectedImage, setSelectedImage] = useState(null);
          const [refreshKey, setRefreshKey] = useState(0);
          
          // 관리자 상태
          const [isAdmin, setIsAdmin] = useState(false);
          const [showAuthModal, setShowAuthModal] = useState(false);
          const [authInput, setAuthInput] = useState("");
          const [cropTarget, setCropTarget] = useState(null); 
          const [activeTab, setActiveTab] = useState('catalog');
          
          const adminClickCount = useRef(0);
          const adminTimer = useRef(null);

          // 옵션(개별) 선택 상태 보관함
          const [selectedOptions, setSelectedOptions] = useState(() => {
            try { 
                const saved = localStorage.getItem('ember_cart_v3'); 
                const parsed = saved ? JSON.parse(saved) : []; 
                return Array.isArray(parsed) ? parsed : []; 
            } 
            catch (e) { return []; }
          });

          useEffect(() => { localStorage.setItem('ember_cart_v3', JSON.stringify(selectedOptions)); }, [selectedOptions]);

          // 구글 시트 데이터 로드 및 동적 스마트 그룹화 알고리즘
          useEffect(() => {
            const fetchSheetData = async () => {
              setIsLoading(true);
              try {
                // 1. 강제 캐시 우회(Cache-Busting)를 위한 타임스탬프 추가
                const timestamp = new Date().getTime();
                const csvUrl = `https://docs.google.com/spreadsheets/d/e/2PACX-1vRI6cW1MyLv5gbcfsjEyYuMDWdL6jDit_Fuz2ZNXPKwEJZeedXoNorHHhUdsoDnDxBzzrFu6P72WVOy/pub?gid=1797935796&single=true&output=csv&t=${timestamp}`;
                
                // 2. 브라우저 캐시도 완벽히 무시하도록 강력한 옵션(cache: 'no-store') 추가
                const response = await fetch(csvUrl, { cache: 'no-store' });
                const text = await response.text();
                const rows = text.replace(/\r/g, '').split('\n');
                
                const validRows = [];
                
                rows.forEach((row) => {
                  const cleanRow = row.trim();
                  if (!cleanRow) return;
                  const cols = []; let current = ''; let inQuotes = false;
                  for (let i = 0; i < cleanRow.length; i++) {
                    if (cleanRow[i] === '"') inQuotes = !inQuotes;
                    else if (cleanRow[i] === ',' && !inQuotes) { cols.push(current.trim()); current = ''; }
                    else current += cleanRow[i];
                  }
                  cols.push(current.trim());
                  
                  if (cols[0]) {
                    const firstColLower = String(cols[0]).toLowerCase();
                    if (firstColLower !== "name" && firstColLower !== "price" && firstColLower !== "상품명") {
                      const rawPrice = cols[1] ? String(cols[1]).trim() : '';
                      const numOnly = rawPrice.replace(/[^0-9-]/g, '');
                      const priceNum = parseInt(numOnly, 10);
                      
                      if (rawPrice !== '-' && !(priceNum <= 0)) {
                          validRows.push({
                              originalName: String(cols[0]).trim(),
                              isSoldOut: cols[2] ? String(cols[2]).trim() === '품절' : false,
                              numericPrice: isNaN(priceNum) ? 0 : priceNum,
                              formattedPrice: isNaN(priceNum) ? rawPrice : priceNum.toLocaleString()
                          });
                      }
                    }
                  }
                });

                // 스마트 자동 그룹화
                const groupMap = {};
                validRows.forEach(row => {
                    const numMatch = row.originalName.match(/^(\d+)/);
                    const groupKey = numMatch ? numMatch[1] : row.originalName.split(/\s+/)[0];
                    if (!groupMap[groupKey]) groupMap[groupKey] = [];
                    groupMap[groupKey].push(row);
                });

                const finalGroups = [];
                for (const key in groupMap) {
                    const items = groupMap[key];
                    
                    if (items.length === 1) {
                        finalGroups.push({
                            id: getSafeKey(items[0].originalName),
                            name: items[0].originalName,
                            formattedPrice: items[0].formattedPrice,
                            numericPrice: items[0].numericPrice,
                            options: [{
                                originalName: items[0].originalName,
                                displayName: '기본(단품)',
                                isSoldOut: items[0].isSoldOut,
                                numericPrice: items[0].numericPrice
                            }]
                        });
                        continue;
                    }

                    const splitItems = items.map(item => item.originalName.split(/\s+/));
                    const minLen = Math.min(...splitItems.map(arr => arr.length));
                    let commonWordCount = 0;

                    for (let i = 0; i < minLen; i++) {
                        const word = splitItems[0][i];
                        const allMatch = splitItems.every(arr => arr[i] === word);
                        if (allMatch) {
                            commonWordCount++;
                        } else {
                            break;
                        }
                    }

                    if (commonWordCount === 0) commonWordCount = 1;

                    const baseName = splitItems[0].slice(0, commonWordCount).join(' ');
                    const safeKey = getSafeKey(baseName);

                    const options = items.map((item, idx) => {
                        const optName = splitItems[idx].slice(commonWordCount).join(' ') || '기본(단품)';
                        return {
                            originalName: item.originalName,
                            displayName: optName,
                            isSoldOut: item.isSoldOut,
                            numericPrice: item.numericPrice
                        };
                    });

                    finalGroups.push({
                        id: safeKey,
                        name: baseName,
                        formattedPrice: items[0].formattedPrice,
                        numericPrice: items[0].numericPrice,
                        options: options
                    });
                }

                const groupArray = finalGroups.sort((a, b) => {
                  const numA = a.name.match(/^(\d+)/) ? parseInt(a.name.match(/^(\d+)/)[0]) : 9999;
                  const numB = b.name.match(/^(\d+)/) ? parseInt(b.name.match(/^(\d+)/)[0]) : 9999;
                  if (numA === 9999 && numB === 9999) return a.name.localeCompare(b.name);
                  return numA - numB;
                });
                
                setGroupedProducts(groupArray);
                
                const allValidOptions = groupArray.flatMap(g => g.options.map(o => o.originalName));
                setSelectedOptions(prev => (Array.isArray(prev) ? prev : []).filter(name => allValidOptions.includes(name)));
                setIsLoading(false);
              } catch (error) {
                console.error("데이터 로드 실패:", error);
                setIsLoading(false);
              }
            };
            fetchSheetData();
          }, [refreshKey]);

          // Firebase 데이터 실시간 수신 (사진, 비고)
          useEffect(() => {
              const ref = db.ref('ember_live_data');
              ref.on('value', (snap) => {
                  if (snap.val()) setFirebaseData(snap.val());
                  else setFirebaseData({});
              });
              return () => ref.off();
          }, []);

          const displayProducts = groupedProducts.map(group => {
              const override = firebaseData[group.id] || {};
              return {
                  ...group,
                  imageUrl: override.image || null,
                  note: override.note || ''
              };
          }).filter(g => g.name.toLowerCase().includes(searchTerm.toLowerCase()) || g.options.some(o => o.originalName.toLowerCase().includes(searchTerm.toLowerCase())));

          // --- 관리자 제어 ---
          const handleAdminClick = () => {
              if (isAdmin) { setIsAdmin(false); setActiveTab('catalog'); return; }
              adminClickCount.current++;
              clearTimeout(adminTimer.current);
              if (adminClickCount.current >= 3) {
                  adminClickCount.current = 0;
                  setShowAuthModal(true);
              } else {
                  adminTimer.current = setTimeout(() => { adminClickCount.current = 0; }, 800);
              }
          };

          const verifyAdmin = () => {
              if (authInput === "1234") { 
                  setIsAdmin(true); setShowAuthModal(false); setAuthInput(""); 
              } else {
                  alert("비밀번호 불일치");
              }
          };

          const handleSaveImage = (groupId, base64Image) => {
              db.ref(`ember_live_data/${groupId}/image`).set(base64Image)
                .then(() => { showToast("사진이 등록되었습니다."); setCropTarget(null); });
          };

          // 비고란 인라인 저장 처리
          const handleSaveNote = (groupId, noteText) => {
              db.ref(`ember_live_data/${groupId}/note`).set(noteText.trim());
          };

          const toggleOptionSelection = (originalName) => {
              setSelectedOptions(prev => prev.includes(originalName) ? prev.filter(n => n !== originalName) : [...prev, originalName]);
          };

          const showToast = (message) => { setToastMessage(message); setTimeout(() => setToastMessage(""), 2000); }

          const handleCopyAll = () => {
            if (selectedOptions.length === 0) return;
            let total = 0;
            let orderLines = [];

            groupedProducts.forEach(group => {
                group.options.forEach(opt => {
                    if (selectedOptions.includes(opt.originalName)) {
                        total += opt.numericPrice;
                        orderLines.push(`${opt.originalName} - ${opt.numericPrice.toLocaleString()}원`);
                    }
                });
            });

            const textToCopy = `${orderLines.join('\n')}\n총 상품 합계: ${total.toLocaleString()}원`;

            const textArea = document.createElement("textarea");
            textArea.value = textToCopy; textArea.style.position = "fixed"; textArea.style.left = "-9999px";
            document.body.appendChild(textArea); textArea.select();
            try { document.execCommand('copy'); showToast(`선택하신 ${selectedOptions.length}개 상품 복사 완료!`); } catch (err) {}
            document.body.removeChild(textArea);
          };

          // --- 전체 포장 리스트 PDF 출력(인쇄) ---
          const handlePrintPDF = () => {
              const printWindow = window.open('', '_blank');
              if (!printWindow) {
                  alert("팝업 차단이 설정되어 있습니다. 팝업을 허용해주세요!");
                  return;
              }

              let htmlContent = `
                  <html>
                  <head>
                      <title>EMBER 포장 리스트</title>
                      <style>
                          @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;800&display=swap');
                          body { font-family: 'Pretendard', sans-serif; color: #000; margin: 0; padding: 20px; font-size: 14px; background: #fff; }
                          h1 { text-align: center; font-size: 24px; margin-bottom: 5px; }
                          .date { text-align: center; color: #666; font-size: 12px; margin-bottom: 30px; }
                          .item-box { border: 1px solid #ddd; padding: 15px; margin-bottom: 15px; display: flex; gap: 20px; page-break-inside: avoid; border-radius: 8px; }
                          .item-img { width: 100px; height: 100px; object-fit: cover; border-radius: 6px; border: 1px solid #eee; background: #f9f9f9; display: flex; align-items: center; justify-content: center; font-size: 12px; color: #aaa; }
                          .item-info { flex: 1; }
                          .item-title { font-weight: 800; font-size: 18px; margin: 0 0 5px 0; display: flex; justify-content: space-between; }
                          .item-price { font-weight: 800; }
                          .item-note { color: #2563eb; font-weight: 600; margin: 0 0 10px 0; font-size: 13px; }
                          .item-options { color: #444; line-height: 1.5; }
                          .sold-out { color: #ef4444; font-weight: bold; }
                          @media print {
                              body { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
                          }
                      </style>
                  </head>
                  <body>
                      <h1>EMBER - 전체 포장 확인 리스트</h1>
                      <div class="date">출력일시: ${new Date().toLocaleString()}</div>
              `;

              groupedProducts.forEach(group => {
                  const override = firebaseData[group.id] || {};
                  const imageUrl = override.image || '';
                  const note = override.note || '';
                  const optsText = group.options.map(o => o.isSoldOut ? `<span class="sold-out">${o.displayName}(품절)</span>` : o.displayName).join(', ');
                  
                  htmlContent += `
                      <div class="item-box">
                          ${imageUrl ? `<img src="${imageUrl}" class="item-img" />` : `<div class="item-img">사진 없음</div>`}
                          <div class="item-info">
                              <h3 class="item-title"><span>${group.name}</span><span class="item-price">${group.formattedPrice}원</span></h3>
                              ${note ? `<p class="item-note">비고: ${note}</p>` : ''}
                              <div class="item-options">옵션: ${optsText}</div>
                          </div>
                      </div>
                  `;
              });

              htmlContent += `</body></html>`;
              
              printWindow.document.write(htmlContent);
              printWindow.document.close();
              printWindow.focus();
              
              // 렌더링 대기 후 인쇄 창 띄우기
              setTimeout(() => {
                  printWindow.print();
              }, 500);
          };

          const totalAmount = selectedOptions.reduce((sum, optName) => {
              for (const g of groupedProducts) {
                  const found = g.options.find(o => o.originalName === optName);
                  if (found) return sum + found.numericPrice;
              }
              return sum;
          }, 0);

          return (
            <div className="w-full h-full max-w-md bg-white shadow-2xl relative overflow-hidden flex flex-col mx-auto border-x border-slate-200">
                
                {/* 상단 헤더 */}
                <header className="py-2.5 bg-black flex-shrink-0 z-20 relative flex items-center justify-center">
                  <h1 className="text-lg font-serif text-white tracking-[0.2em] uppercase">EMBER</h1>
                  <button onClick={handleAdminClick} className="absolute right-3 p-2 text-gray-700 hover:text-gray-400" title="관리자">
                    <svg xmlns="http://www.w3.org/2000/svg" className="h-[14px] w-[14px]" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                      <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                    </svg>
                  </button>
                </header>

                {isAdmin && (
                    <div className="flex bg-slate-100 p-1 border-b border-slate-200 shrink-0">
                        <button onClick={() => setActiveTab('catalog')} className={`flex-1 py-1.5 text-xs font-bold rounded ${activeTab === 'catalog' ? 'bg-white shadow-sm text-black' : 'text-slate-500'}`}>고객 뷰</button>
                        <button onClick={() => setActiveTab('admin')} className={`flex-1 py-1.5 text-xs font-bold rounded ${activeTab === 'admin' ? 'bg-white shadow-sm text-black' : 'text-slate-500'}`}>관리자 모드</button>
                    </div>
                )}

                <main className="flex-1 overflow-y-auto bg-slate-50 relative">
                  
                  {/* 공통 검색 및 새로고침 바 (관리자 모드에서도 보임) */}
                  <div className="sticky top-0 z-10 bg-white border-b border-slate-200 px-4 py-2.5 shadow-sm flex items-center gap-2">
                    <div className="relative flex-1">
                        <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none"><SearchIcon className="text-slate-400" /></div>
                        <input type="text" placeholder="상품명 또는 번호 검색" className="w-full pl-9 pr-4 py-1.5 bg-slate-100 border border-transparent rounded-md text-sm outline-none focus:bg-white focus:border-slate-300 transition-colors" value={searchTerm} onChange={(e) => setSearchTerm(e.target.value)} />
                    </div>
                    <button onClick={() => setRefreshKey(prev => prev + 1)} className="shrink-0 px-2.5 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-600 hover:text-black rounded-md text-[11px] font-bold flex items-center gap-1 transition-colors border border-transparent active:border-slate-300">
                        <svg className={`w-3 h-3 ${isLoading ? 'animate-spin' : ''}`} fill="none" stroke="currentColor" strokeWidth="2.5" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                        새로고침
                    </button>
                  </div>

                  {/* 품절 안내 상단 문구 추가 */}
                  <div className="bg-red-50/60 py-2 px-4 border-b border-red-100/60 text-center shrink-0">
                      <p className="text-[11px] text-slate-800 font-medium tracking-tight">
                          ※ <span className="line-through decoration-red-500 decoration-2 font-bold text-red-600 mr-0.5">빨간 취소선</span>은 <span className="font-bold text-red-600">품절 상품</span>으로 주문 불가능합니다. 제품이 목록에 보이지 않으면 <span className="font-bold text-red-600">새로고침</span> 해주세요.
                      </p>
                  </div>

                  {/* 관리자 모드: 인쇄 버튼 패널 */}
                  {isAdmin && activeTab === 'admin' && (
                      <div className="p-4 bg-white border-b border-slate-200 shadow-sm">
                          <button onClick={handlePrintPDF} className="w-full py-3 bg-black text-white text-xs font-bold tracking-widest uppercase rounded-lg shadow hover:bg-slate-800 transition flex items-center justify-center gap-2">
                              <span>🖨️ 포장 리스트 인쇄 / PDF 저장</span>
                          </button>
                          <p className="text-[11px] text-slate-400 text-center mt-2">고화질 문서 형태로 인쇄하거나 PDF 파일로 저장할 수 있습니다.</p>
                      </div>
                  )}

                  {isLoading ? (
                      <div className="text-center py-20 text-slate-400 text-xs font-bold tracking-widest uppercase">Loading Lineup...</div>
                  ) : (
                      <ul className="divide-y divide-slate-100 pb-8">
                        {displayProducts.map((group) => (
                            <li key={group.id} className="flex p-4 bg-white">
                                {/* 썸네일 영역 (크기 110px 확대) */}
                                <div className="shrink-0 mr-4">
                                    {group.imageUrl ? (
                                        <img 
                                            src={group.imageUrl} 
                                            onClick={() => {
                                                if (isAdmin && activeTab === 'admin') setCropTarget(group);
                                                else setSelectedImage(group.imageUrl);
                                            }} 
                                            className={`w-[110px] h-[110px] object-cover rounded-lg border cursor-pointer shadow-sm ${isAdmin && activeTab === 'admin' ? 'border-blue-400 ring-2 ring-blue-100' : 'border-slate-200'}`} 
                                        />
                                    ) : (
                                        <div 
                                            onClick={() => {
                                                if (isAdmin && activeTab === 'admin') setCropTarget(group);
                                            }}
                                            className={`w-[110px] h-[110px] bg-slate-50 flex items-center justify-center rounded-lg border border-slate-200 text-slate-300 ${isAdmin && activeTab === 'admin' ? 'cursor-pointer hover:bg-slate-100 border-dashed border-2' : ''}`}
                                        >
                                            <svg className="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="1.5" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                                        </div>
                                    )}
                                </div>
                                
                                {/* 텍스트 및 옵션 영역 */}
                                <div className="flex-1 flex flex-col justify-center min-w-0">
                                    <div className="flex justify-between items-start gap-2">
                                        <h3 className="text-[14px] font-bold text-slate-900 leading-snug truncate">{group.name}</h3>
                                        <span className="text-[14px] font-extrabold text-slate-900 shrink-0">{group.formattedPrice}</span>
                                    </div>
                                    
                                    {/* 비고란 인라인 편집 (관리자 모드) 또는 일반 텍스트 (고객 모드) */}
                                    {isAdmin && activeTab === 'admin' ? (
                                        <input 
                                            type="text"
                                            defaultValue={group.note}
                                            onBlur={(e) => handleSaveNote(group.id, e.target.value)}
                                            onKeyDown={(e) => { if(e.key === 'Enter') e.target.blur(); }}
                                            placeholder="📝 비고 입력칸 (클릭하여 입력)"
                                            className="mt-1 text-[11px] text-blue-600 font-medium bg-blue-50/50 border border-blue-100 rounded px-1.5 py-0.5 outline-none focus:bg-white focus:border-blue-300 w-full transition-colors placeholder:text-blue-300"
                                        />
                                    ) : (
                                        group.note && <p className="text-[11px] text-blue-600 font-medium mt-1 truncate">{group.note}</p>
                                    )}
                                    
                                    {/* 옵션 칩 (기존 가로 배열 및 빨간색 취소선으로 복구) */}
                                    <div className="mt-2.5 flex flex-wrap gap-1.5">
                                        {group.options.map(opt => {
                                            const isSelected = selectedOptions.includes(opt.originalName);
                                            return (
                                                <button 
                                                    key={opt.originalName} 
                                                    onClick={() => toggleOptionSelection(opt.originalName)}
                                                    className={`px-2.5 py-1 text-[11px] font-bold border rounded-sm transition-colors ${
                                                        isSelected 
                                                            ? 'bg-black text-white border-black shadow-sm' 
                                                            : 'bg-white text-slate-700 border-slate-300 active:bg-slate-50'
                                                    }`}
                                                >
                                                    <span className={opt.isSoldOut && !isSelected ? 'line-through decoration-red-500 decoration-2' : ''}>
                                                        {opt.displayName}
                                                    </span>
                                                </button>
                                            );
                                        })}
                                    </div>
                                </div>
                            </li>
                        ))}
                      </ul>
                  )}

                  {/* 눈에 안 띄게 바뀐 하단 꼬리표 */}
                  {!isLoading && displayProducts.length > 0 && (
                      <div className="py-4 text-center text-slate-400/60 text-[9px] uppercase tracking-widest bg-white">
                          <p className="mb-0.5">Ember Sister Official</p>
                          <p>System by. 깔로</p>
                      </div>
                  )}
                  {selectedOptions.length > 0 && activeTab === 'catalog' && <div className="h-20"></div>} 
                </main>

                {/* 플로팅 장바구니 바 */}
                {selectedOptions.length > 0 && activeTab === 'catalog' && (
                  <div className="absolute bottom-0 left-0 right-0 bg-black text-white px-4 py-3 flex items-center justify-between z-40 shadow-[0_-4px_20px_rgba(0,0,0,0.15)] animate-fade-in">
                    <div className="flex flex-col shrink-0 pr-2">
                      <div className="text-[10px] text-slate-400 font-bold mb-0.5">{selectedOptions.length}개 선택됨</div>
                      <div className="text-[16px] font-bold font-serif tracking-widest">{totalAmount.toLocaleString()}</div>
                    </div>
                    <div className="flex gap-1.5 shrink-0">
                      <button onClick={() => setSelectedOptions([])} className="px-3 py-1.5 border border-slate-600 text-slate-300 text-[11px] font-bold rounded-sm active:bg-slate-800">초기화</button>
                      <button onClick={handleCopyAll} className="px-4 py-1.5 bg-white text-black text-[11px] font-bold rounded-sm active:bg-slate-200">주문서 복사</button>
                    </div>
                  </div>
                )}

                {/* 토스트 메시지 */}
                {toastMessage && (
                  <div className="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 bg-black/90 text-white px-5 py-3 text-[12px] font-bold tracking-widest shadow-2xl z-50 whitespace-nowrap rounded animate-fade-in">
                    {toastMessage}
                  </div>
                )}
                
                {/* 썸네일 확대 모달 (우측 상단 닫기 버튼 추가) */}
                {selectedImage && (
                  <div className="fixed inset-0 z-[100] flex items-center justify-center bg-black/90 p-4 animate-fade-in" onClick={() => setSelectedImage(null)}>
                    <button onClick={() => setSelectedImage(null)} className="absolute top-4 right-4 text-white/70 hover:text-white p-2">
                        <svg className="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                    </button>
                    <img src={selectedImage} className="w-full max-w-2xl h-auto max-h-[85vh] object-contain rounded shadow-2xl" onClick={e => e.stopPropagation()} />
                  </div>
                )}

                {/* 비밀번호 모달 */}
                {showAuthModal && (
                    <div className="fixed inset-0 z-[100] flex items-center justify-center bg-slate-900/80 backdrop-blur-sm p-4 animate-fade-in">
                        <div className="bg-white p-5 max-w-xs w-full shadow-2xl rounded-xl">
                            <h3 className="font-bold text-base mb-3">관리자 로그인</h3>
                            <input type="password" value={authInput} onChange={e => setAuthInput(e.target.value)} onKeyDown={e => e.key === 'Enter' && verifyAdmin()} placeholder="비밀번호를 입력하세요" className="w-full border border-slate-300 px-3 py-2 text-sm rounded-lg mb-4 outline-none focus:border-black" />
                            <div className="flex gap-2">
                                <button onClick={() => setShowAuthModal(false)} className="flex-1 py-2 bg-slate-100 text-slate-600 font-bold text-sm rounded-lg">취소</button>
                                <button onClick={verifyAdmin} className="flex-1 py-2 bg-black text-white font-bold text-sm rounded-lg">확인</button>
                            </div>
                        </div>
                    </div>
                )}

                {/* 크롭 모달 */}
                {cropTarget && <CropperModal product={cropTarget} onClose={() => setCropTarget(null)} onSave={handleSaveImage} />}
                
            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<ErrorBoundary><App /></ErrorBoundary>);
    </script>
</body>
</html>
