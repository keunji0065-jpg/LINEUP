<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EMBER OFFICIAL LINEUP</title>
    <!-- 디자인(Tailwind CSS) -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & Babel -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js" crossorigin="anonymous"></script>
    
    <!-- 🚨 Firebase SDK 추가 -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <!-- 주문서와 동일한 폰트 및 스타일 적용 -->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;1,600&display=swap');
        
        body { 
            font-family: 'Pretendard', sans-serif; 
            background-color: #f3f4f6; 
            color: #111827; 
        }
        .font-serif { font-family: 'Playfair Display', serif; }
        .break-keep { word-break: keep-all; }
        
        .input-chic {
            border-radius: 0;
            border: 1px solid #d1d5db;
            background-color: #fafafa;
            transition: all 0.3s ease;
        }
        .input-chic:focus {
            border-color: #000000;
            background-color: #ffffff;
            box-shadow: none;
            outline: none;
        }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #e5e7eb; }
        ::-webkit-scrollbar-thumb:hover { background: #d1d5db; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in { animation: fadeIn 0.3s ease-out forwards; }

        /* 크롭퍼 캔버스 스타일 */
        .crop-canvas-container {
            width: 100%;
            aspect-ratio: 1 / 1;
            background-color: #111827;
            position: relative;
            overflow: hidden;
            touch-action: none;
            cursor: grab;
        }
        .crop-canvas-container:active { cursor: grabbing; }
        .crop-canvas-container canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body class="antialiased min-h-screen flex flex-col">
    <div id="root">
        <div style="display:flex; height:100vh; align-items:center; justify-content:center; color:#9ca3af; font-size:14px;">
            라인업을 불러오는 중입니다... 잠시만 기다려주세요.
        </div>
    </div>

    <!-- 🚨 FIREBASE 초기화 (실제 사장님 키 적용 완료) -->
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDgdH34cDnp2S9akHfFLYBSpHzzamHFuoc",
            authDomain: "my-live-shop.firebaseapp.com",
            databaseURL: "https://my-live-shop-default-rtdb.firebaseio.com",
            projectId: "my-live-shop",
            storageBucket: "my-live-shop.firebasestorage.app",
            messagingSenderId: "598748133843",
            appId: "1:598748133843:web:17c7d83321fc191f85d726",
            measurementId: "G-9EX0P6H2Y7"
        };
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.database();
    </script>

    <script type="text/babel">
        const { useState, useEffect, useRef, useCallback } = React;

        // Firebase 키 안전 변환 함수 (특수문자 방지)
        const getSafeKey = (name) => name.replace(/[.#$\[\]]/g, '_');

        class ErrorBoundary extends React.Component {
            constructor(props) {
                super(props);
                this.state = { hasError: false };
            }
            static getDerivedStateFromError(error) { return { hasError: true }; }
            componentDidCatch(error, errorInfo) { console.error("오류 발생:", error, errorInfo); }
            render() {
                if (this.state.hasError) {
                    return (
                        <div className="flex flex-col items-center justify-center min-h-screen bg-gray-50 text-center px-5">
                            <div className="text-4xl mb-4">⚠️</div>
                            <h2 className="text-lg font-bold mb-2">일시적인 오류가 발생했습니다.</h2>
                            <button onClick={() => window.location.reload()} className="px-6 py-3 bg-black text-white text-sm font-bold tracking-widest uppercase rounded-sm">새로고침 하기</button>
                        </div>
                    );
                }
                return this.props.children;
            }
        }

        const SearchIcon = ({ size = 18 }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        );

        const RefreshIcon = ({ size = 18, className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" className={className} width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round">
                <polyline points="23 4 23 10 17 10"></polyline>
                <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
            </svg>
        );

        // ==========================================
        // [추가] 1:1 사진 등록 (크롭퍼) 모달 컴포넌트
        // ==========================================
        const CropperModal = ({ product, onClose, onSave }) => {
            const canvasRef = useRef(null);
            const [imageObj, setImageObj] = useState(null);
            const [scale, setScale] = useState(1);
            
            // Pan State (React Refs for performance)
            const pan = useRef({ x: 0, y: 0 });
            const isDragging = useRef(false);
            const dragStart = useRef({ x: 0, y: 0 });

            // 1. 붙여넣기(Ctrl+V) 감지
            useEffect(() => {
                const handlePaste = (e) => {
                    const items = (e.clipboardData || e.originalEvent.clipboardData).items;
                    for (const item of items) {
                        if (item.type.indexOf('image') !== -1) {
                            const blob = item.getAsFile();
                            const reader = new FileReader();
                            reader.onload = (evt) => {
                                const img = new Image();
                                img.onload = () => {
                                    setImageObj(img);
                                    // 초기 중앙 정렬 세팅
                                    const cSize = 500;
                                    const aspect = img.width / img.height;
                                    let initialScale = 1;
                                    if (aspect > 1) initialScale = cSize / img.height;
                                    else initialScale = cSize / img.width;
                                    
                                    setScale(initialScale);
                                    pan.current = {
                                        x: (cSize - img.width * initialScale) / 2,
                                        y: (cSize - img.height * initialScale) / 2
                                    };
                                    draw();
                                };
                                img.src = evt.target.result;
                            };
                            reader.readAsDataURL(blob);
                            e.preventDefault();
                            break;
                        }
                    }
                };
                window.addEventListener('paste', handlePaste);
                return () => window.removeEventListener('paste', handlePaste);
            }, []);

            // 2. 캔버스 그리기
            const draw = useCallback(() => {
                const canvas = canvasRef.current;
                if (!canvas || !imageObj) return;
                const ctx = canvas.getContext('2d');
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.drawImage(imageObj, pan.current.x, pan.current.y, imageObj.width * scale, imageObj.height * scale);
            }, [imageObj, scale]);

            useEffect(() => { draw(); }, [draw, scale]);

            // 3. 드래그 및 줌 이벤트
            const handleMouseDown = (e) => {
                if (!imageObj) return;
                isDragging.current = true;
                dragStart.current = { x: e.clientX - pan.current.x, y: e.clientY - pan.current.y };
            };
            const handleMouseMove = (e) => {
                if (!isDragging.current) return;
                pan.current = { x: e.clientX - dragStart.current.x, y: e.clientY - dragStart.current.y };
                draw();
            };
            const handleMouseUp = () => { isDragging.current = false; };
            
            const handleTouchStart = (e) => {
                if (!imageObj || e.touches.length !== 1) return;
                isDragging.current = true;
                dragStart.current = { x: e.touches[0].clientX - pan.current.x, y: e.touches[0].clientY - pan.current.y };
            };
            const handleTouchMove = (e) => {
                if (!isDragging.current || e.touches.length !== 1) return;
                pan.current = { x: e.touches[0].clientX - dragStart.current.x, y: e.touches[0].clientY - dragStart.current.y };
                draw();
            };

            const handleWheel = (e) => {
                if (!imageObj) return;
                const zoomFactor = e.deltaY < 0 ? 1.05 : 0.95;
                setScale(prev => Math.min(Math.max(prev * zoomFactor, 0.2), 5));
            };

            // 4. 저장 처리
            const handleSave = () => {
                if (!imageObj) return alert('이미지를 먼저 붙여넣어주세요.');
                const exportCanvas = document.createElement('canvas');
                exportCanvas.width = 480; exportCanvas.height = 480;
                const ctx = exportCanvas.getContext('2d');
                // 현재 뷰포트 비율에 맞게 보정하여 추출
                const ratio = 480 / 500; 
                ctx.drawImage(imageObj, pan.current.x * ratio, pan.current.y * ratio, imageObj.width * scale * ratio, imageObj.height * scale * ratio);
                const base64 = exportCanvas.toDataURL('image/jpeg', 0.7);
                onSave(product.name, base64);
            };

            return (
                <div className="fixed inset-0 z-[100] flex items-center justify-center bg-black/80 backdrop-blur-sm p-4 animate-fade-in">
                    <div className="bg-white max-w-sm w-full p-5 shadow-2xl flex flex-col">
                        <div className="flex justify-between items-center mb-4">
                            <h3 className="font-bold text-lg">사진 등록: {product.name}</h3>
                            <button onClick={onClose} className="text-2xl text-gray-400 hover:text-black">&times;</button>
                        </div>
                        
                        <div className="text-xs text-gray-500 mb-2">화면 캡처 후 <b>Ctrl+V</b>를 누르세요. (마우스로 이동/줌 가능)</div>
                        
                        <div 
                            className="crop-canvas-container"
                            onMouseDown={handleMouseDown} onMouseMove={handleMouseMove} onMouseUp={handleMouseUp} onMouseLeave={handleMouseUp}
                            onTouchStart={handleTouchStart} onTouchMove={handleTouchMove} onTouchEnd={handleMouseUp}
                            onWheel={handleWheel}
                        >
                            <canvas ref={canvasRef} width={500} height={500}></canvas>
                            {!imageObj && (
                                <div className="absolute inset-0 flex flex-col items-center justify-center text-gray-500 pointer-events-none">
                                    <div className="text-3xl mb-2">📸</div>
                                    <p className="text-sm font-bold">Ctrl + V 로 붙여넣기</p>
                                </div>
                            )}
                        </div>
                        
                        {imageObj && (
                            <div className="mt-3 flex items-center gap-2">
                                <span className="text-xs font-bold text-gray-600 shrink-0">크기 조절</span>
                                <input type="range" min="0.2" max="5" step="0.05" value={scale} onChange={e => setScale(parseFloat(e.target.value))} className="w-full accent-black" />
                            </div>
                        )}

                        <button onClick={handleSave} className="mt-5 w-full py-3 bg-black text-white font-bold tracking-widest text-sm hover:bg-gray-800 transition">
                            이 구획으로 사진 저장
                        </button>
                    </div>
                </div>
            );
        };

        function App() {
          const [sheetProducts, setSheetProducts] = useState([]); // 구글 시트 원본 데이터
          const [firebaseOverrides, setFirebaseOverrides] = useState({}); // 파이어베이스 (사진, 품절상태)
          const [searchTerm, setSearchTerm] = useState("");
          const [toastMessage, setToastMessage] = useState("");
          const [isLoading, setIsLoading] = useState(true);
          const [selectedImage, setSelectedImage] = useState(null);
          
          const [refreshKey, setRefreshKey] = useState(0); 
          const [showTopBtn, setShowTopBtn] = useState(false);
          const scrollContainerRef = useRef(null);

          // Admin State
          const [isAdmin, setIsAdmin] = useState(false);
          const [showAuthModal, setShowAuthModal] = useState(false);
          const [authInput, setAuthInput] = useState("");
          const [cropTarget, setCropTarget] = useState(null); // 어떤 상품 사진을 수정중인지
          
          const adminClickCount = useRef(0);
          const adminTimer = useRef(null);

          const [selectedNames, setSelectedNames] = useState(() => {
            try { const saved = localStorage.getItem('ember_cart'); return saved ? JSON.parse(saved) : []; } 
            catch (e) { return []; }
          });

          useEffect(() => { localStorage.setItem('ember_cart', JSON.stringify(selectedNames)); }, [selectedNames]);

          // 1. 구글 시트 데이터 로드
          useEffect(() => {
            const fetchSheetData = async () => {
              setIsLoading(true);
              try {
                const csvUrl = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRI6cW1MyLv5gbcfsjEyYuMDWdL6jDit_Fuz2ZNXPKwEJZeedXoNorHHhUdsoDnDxBzzrFu6P72WVOy/pub?gid=1797935796&single=true&output=csv";
                const response = await fetch(csvUrl);
                const text = await response.text();
                const rows = text.replace(/\r/g, '').split('\n');
                let data = [];
                
                rows.forEach((row, index) => {
                  const cleanRow = row.trim();
                  if (!cleanRow) return;
                  const cols = []; let current = ''; let inQuotes = false;
                  for (let i = 0; i < cleanRow.length; i++) {
                    if (cleanRow[i] === '"') inQuotes = !inQuotes;
                    else if (cleanRow[i] === ',' && !inQuotes) { cols.push(current.trim()); current = ''; }
                    else current += cleanRow[i];
                  }
                  cols.push(current.trim());
                  
                  if (cols[0]) {
                    const firstColLower = String(cols[0]).toLowerCase();
                    if (firstColLower !== "name" && firstColLower !== "price" && firstColLower !== "상품명") {
                      const rawPrice = cols[1] ? String(cols[1]).trim() : '';
                      const numOnly = rawPrice.replace(/[^0-9-]/g, '');
                      const priceNum = parseInt(numOnly, 10);
                      const isMemo = rawPrice === '-' || (!isNaN(priceNum) && priceNum <= 0);

                      if (!isMemo) {
                        data.push({
                          id: index,
                          name: String(cols[0]),
                          price: cols[1] || '',
                          status: cols[2] ? String(cols[2]).trim() : '',
                          sheetImageUrl: cols[3] ? String(cols[3]).trim() : ''
                        });
                      }
                    }
                  }
                });

                data.sort((a, b) => {
                  const numA = a.name.match(/^(\d+)/) ? parseInt(a.name.match(/^(\d+)/)[0]) : 0;
                  const numB = b.name.match(/^(\d+)/) ? parseInt(b.name.match(/^(\d+)/)[0]) : 0;
                  if (numA === 0 && numB === 0) return a.name.localeCompare(b.name);
                  return numB - numA;
                });
                
                setSheetProducts(data);
                setSelectedNames(prev => prev.filter(name => data.map(p=>p.name).includes(name)));
                setIsLoading(false);
              } catch (error) {
                console.error("데이터 로드 실패:", error);
                setIsLoading(false);
              }
            };
            fetchSheetData();
          }, [refreshKey]);

          // 2. 파이어베이스 데이터 실시간 연동 (오버라이드용)
          useEffect(() => {
              const ref = db.ref('ember_live_data');
              ref.on('value', (snap) => {
                  if (snap.val()) setFirebaseOverrides(snap.val());
                  else setFirebaseOverrides({});
              });
          }, []);

          // 3. 데이터 결합 (시트 원본 + 파이어베이스 사진/상태)
          const mergedProducts = sheetProducts.map(p => {
              const safeKey = getSafeKey(p.name);
              const override = firebaseOverrides[safeKey] || {};
              return {
                  ...p,
                  // 파이어베이스에 사진이 있으면 덮어쓰고, 없으면 시트 원본 사진 사용
                  finalImage: override.image || p.sheetImageUrl || null,
                  // 파이어베이스에서 품절 처리했으면 우선 적용
                  isSoldOut: override.isSoldOut !== undefined ? override.isSoldOut : (p.status === '품절')
              };
          });

          // 검색 필터링
          const displayProducts = mergedProducts.filter(p => p.name.toLowerCase().includes(searchTerm.toLowerCase()));

          // --- Admin Logic ---
          const handleAdminClick = () => {
              if (isAdmin) { setIsAdmin(false); showToast("관리자 모드 종료"); return; }
              adminClickCount.current++;
              clearTimeout(adminTimer.current);
              if (adminClickCount.current >= 3) {
                  adminClickCount.current = 0;
                  setShowAuthModal(true);
              } else {
                  adminTimer.current = setTimeout(() => { adminClickCount.current = 0; }, 800);
              }
          };

          const verifyAdmin = () => {
              if (authInput === "1234") { // 기본 비밀번호 1234
                  setIsAdmin(true);
                  setShowAuthModal(false);
                  setAuthInput("");
                  showToast("관리자 모드 활성화");
              } else {
                  alert("비밀번호 불일치");
              }
          };

          const toggleSoldOut = (productName, currentStatus) => {
              const safeKey = getSafeKey(productName);
              db.ref(`ember_live_data/${safeKey}/isSoldOut`).set(!currentStatus);
          };

          const handleSaveImage = (productName, base64Image) => {
              const safeKey = getSafeKey(productName);
              db.ref(`ember_live_data/${safeKey}/image`).set(base64Image)
                .then(() => {
                    showToast("사진이 실시간으로 등록되었습니다.");
                    setCropTarget(null);
                });
          };

          // --- Utility ---
          const handleCopyAccount = () => {
            const accountInfo = "카카오뱅크 7942-32-84990 김선정";
            const textArea = document.createElement("textarea");
            textArea.value = accountInfo; textArea.style.position = "fixed"; textArea.style.opacity = "0";
            document.body.appendChild(textArea); textArea.select();
            try { document.execCommand('copy'); showToast("계좌번호가 복사되었습니다."); } catch (err) {}
            document.body.removeChild(textArea);
          };

          const handleCopy = (product, formattedPrice) => {
            const textToCopy = `${product.name} ${formattedPrice}`;
            const textArea = document.createElement("textarea");
            textArea.value = textToCopy; textArea.style.position = "fixed"; textArea.style.opacity = "0";
            document.body.appendChild(textArea); textArea.select();
            try { document.execCommand('copy'); showToast(product.name); } catch (err) {}
            document.body.removeChild(textArea);
          };

          const handleCopyAll = () => {
            const selected = displayProducts.filter(p => selectedNames.includes(p.name));
            if (selected.length === 0) return;
            let total = 0;
            let textToCopy = selected.map(p => {
               const num = parseInt(p.price.replace(/[^0-9]/g, ''), 10);
               if(!isNaN(num)) total += num;
               const formattedPrice = isNaN(num) ? p.price : num.toLocaleString();
               return `${p.name} ${formattedPrice}`;
            }).join('\n');
            textToCopy += `\n------------------\n총 상품 금액: ${total.toLocaleString()}원`;

            const textArea = document.createElement("textarea");
            textArea.value = textToCopy; textArea.style.position = "fixed"; textArea.style.opacity = "0";
            document.body.appendChild(textArea); textArea.select();
            try { document.execCommand('copy'); showToast(`총 ${selected.length}개 상품 복사 완료!`); } catch (err) {}
            document.body.removeChild(textArea);
          };

          const toggleSelection = (productName) => {
            setSelectedNames(prev => prev.includes(productName) ? prev.filter(n => n !== productName) : [...prev, productName]);
          };

          const showToast = (message) => {
              setToastMessage(message);
              setTimeout(() => setToastMessage(""), 2000);
          }

          const handleScroll = (e) => { setShowTopBtn(e.target.scrollTop > 300); };
          const scrollToTop = () => { if (scrollContainerRef.current) scrollContainerRef.current.scrollTo({ top: 0, behavior: 'smooth' }); };

          const selectedCount = selectedNames.length;
          const totalPrice = displayProducts.filter(p => selectedNames.includes(p.name)).reduce((sum, p) => {
            const num = parseInt(p.price.replace(/[^0-9]/g, ''), 10);
            return sum + (isNaN(num) ? 0 : num);
          }, 0);

          return (
            <div className="flex justify-center sm:items-center w-full" style={{ height: '100dvh' }}>
              <div className="w-full max-w-md bg-white h-full relative flex flex-col shadow-2xl sm:h-[800px] sm:rounded-none overflow-hidden">
                
                <header className="py-4 bg-black flex-shrink-0 z-20 relative flex items-center justify-center">
                  <div className="text-center">
                    <h1 className="text-xl font-serif text-white tracking-[0.25em] ml-1 uppercase">
                      EMBER
                    </h1>
                    <p className="text-[9px] text-gray-400 tracking-[0.2em] uppercase mt-0.5">Official Lineup</p>
                  </div>
                  
                  {/* 자물쇠 버튼 - 우측 절대 배치로 텍스트 중앙 정렬 유지 */}
                  <button
                    onClick={handleAdminClick}
                    className="absolute right-4 text-gray-700 hover:text-gray-400 transition-colors p-2"
                    title="관리자 로그인 (3번 연속 클릭)"
                  >
                    <svg xmlns="http://www.w3.org/2000/svg" className="h-[14px] w-[14px]" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                      <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                    </svg>
                  </button>
                </header>

                <main className="flex-1 flex flex-col bg-white overflow-hidden">
                  <div className="px-5 py-3 border-b border-gray-100 flex-shrink-0">
                    <div className="flex items-center gap-2">
                      <div className="relative flex-1">
                        <div className="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                          <SearchIcon className="text-gray-400" />
                        </div>
                        <input type="text" placeholder="상품명 또는 번호를 검색하세요"
                          className="w-full pl-11 pr-4 py-2.5 input-chic text-sm font-medium tracking-wide text-black placeholder-gray-400"
                          value={searchTerm} onChange={(e) => setSearchTerm(e.target.value)} />
                      </div>
                      <button onClick={() => setRefreshKey(prev => prev + 1)} className="shrink-0 px-3 py-2.5 flex items-center justify-center gap-1.5 border border-gray-300 bg-[#fafafa] text-gray-600 hover:text-black hover:border-black transition-all active:scale-95">
                        <RefreshIcon size={14} className={isLoading ? 'animate-spin text-gray-400' : 'text-gray-500'} />
                        <span className="text-[12px] font-bold tracking-wider">새로고침</span>
                      </button>
                    </div>
                  </div>

                  <div className="bg-[#f9fafb] px-4 py-3 border-b border-gray-100 flex items-center justify-center gap-1.5 flex-shrink-0">
                    <span className="text-[14px] shrink-0">💡</span>
                    <p className="text-[12.5px] text-gray-600 font-medium tracking-tight whitespace-nowrap truncate">
                      체크박스를 선택하면 여러 상품을 <strong className="text-black">한 번에 복사</strong>할 수 있습니다.
                    </p>
                  </div>

                  <div className="flex-1 overflow-y-auto pb-20" ref={scrollContainerRef} onScroll={handleScroll}>
                    {isLoading ? (
                      <div className="text-center py-20 text-gray-400 text-sm font-medium tracking-wider uppercase">Loading...</div>
                    ) : displayProducts.length > 0 ? (
                      <ul className="divide-y divide-gray-200">
                        {displayProducts.map((product, index) => {
                          const num = parseInt(product.price.replace(/[^0-9]/g, ''), 10);
                          const formattedPrice = isNaN(num) ? product.price : num.toLocaleString();
                          const isSoldOut = product.isSoldOut;
                          const isChecked = selectedNames.includes(product.name);

                          return (
                            <li key={product.id} className={`flex flex-col py-4 px-5 transition-colors group ${index % 2 === 0 ? 'bg-white' : 'bg-gray-50'}`}>
                              <div className="flex items-center justify-between">
                                <div className="flex items-center gap-3 pr-4 flex-1 overflow-hidden">
                                    <div className="shrink-0 flex items-center justify-center cursor-pointer py-2 pr-1" onClick={() => !isSoldOut && toggleSelection(product.name)}>
                                        <div className={`w-5 h-5 border flex items-center justify-center transition-colors ${isSoldOut ? 'bg-gray-100 border-gray-200' : isChecked ? 'bg-black border-black' : 'bg-white border-gray-300'}`}>
                                        {isChecked && !isSoldOut && <svg xmlns="http://www.w3.org/2000/svg" className="h-3.5 w-3.5 text-white" viewBox="0 0 20 20" fill="currentColor"><path fillRule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clipRule="evenodd" /></svg>}
                                        </div>
                                    </div>
                                    
                                    {/* 사진 표시 영역 */}
                                    {product.finalImage ? (
                                        <div className="relative w-12 h-12 shrink-0 cursor-pointer overflow-hidden rounded-sm border border-gray-200 shadow-sm" onClick={() => setSelectedImage(product.finalImage)}>
                                            <img src={product.finalImage} alt={product.name} className={`w-full h-full object-cover transition-transform duration-300 ${isSoldOut ? 'grayscale opacity-50' : 'hover:scale-110'}`} />
                                            {isSoldOut && <div className="absolute inset-0 flex items-center justify-center"><div className="bg-black/60 w-full h-[1px]"></div></div>}
                                        </div>
                                    ) : (
                                        <div className="w-12 h-12 shrink-0 bg-gray-100 flex items-center justify-center border border-gray-200 rounded-sm text-gray-300">
                                            <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="1.5" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                                        </div>
                                    )}

                                    <div className="flex flex-col gap-1 flex-1 overflow-hidden">
                                        <div className="flex items-center gap-2">
                                        <span className={`text-[14px] font-medium leading-snug break-keep tracking-wide truncate ${isSoldOut ? 'text-gray-400 line-through' : 'text-black'}`}>
                                            {product.name}
                                        </span>
                                        {isSoldOut && <span className="text-[10px] bg-red-600 text-white px-1.5 py-0.5 tracking-wider font-bold shrink-0">품절</span>}
                                        </div>
                                    </div>
                                </div>
                                
                                <div className="flex items-center gap-4 shrink-0">
                                    <div className={`text-[15px] font-bold tracking-wider ${isSoldOut ? 'text-gray-400' : 'text-black'}`}>
                                        {formattedPrice}
                                    </div>
                                    <button onClick={() => handleCopy(product, formattedPrice)} disabled={isSoldOut} className={`border px-3 py-1.5 text-[14px] font-bold tracking-wider flex items-center justify-center transition-all ${isSoldOut ? 'border-gray-200 text-gray-300 bg-gray-50' : 'border-black text-black bg-white hover:bg-black hover:text-white active:scale-95'}`}>
                                        복사
                                    </button>
                                </div>
                              </div>
                              
                              {/* 관리자 전용 기능 (사진 등록 / 품절 처리) */}
                              {isAdmin && (
                                  <div className="mt-3 flex gap-2 pt-3 border-t border-gray-100 justify-end">
                                      <button onClick={() => setCropTarget(product)} className="px-3 py-1.5 bg-blue-50 text-blue-600 border border-blue-200 text-xs font-bold rounded shadow-sm hover:bg-blue-100">
                                          📸 사진 등록
                                      </button>
                                      <button onClick={() => toggleSoldOut(product.name, isSoldOut)} className={`px-3 py-1.5 text-xs font-bold rounded shadow-sm border ${isSoldOut ? 'bg-emerald-50 text-emerald-700 border-emerald-200 hover:bg-emerald-100' : 'bg-red-50 text-red-600 border-red-200 hover:bg-red-100'}`}>
                                          {isSoldOut ? '✅ 재입고 처리' : '🚫 품절 처리'}
                                      </button>
                                  </div>
                              )}
                            </li>
                          );
                        })}
                      </ul>
                    ) : (
                      <div className="flex flex-col items-center justify-center py-24 px-6 text-center">
                        <div className="text-gray-300 mb-3"><SearchIcon size={32} /></div>
                        <p className="text-gray-500 text-[14px] font-medium tracking-wide mb-1">검색 결과가 없습니다.</p>
                      </div>
                    )}
                  </div>
                  
                  <footer className={`py-8 text-center text-gray-400 text-[10px] border-t border-gray-100 bg-white uppercase tracking-widest mt-auto ${selectedCount > 0 ? 'pb-28' : ''}`}>
                      <p className="mb-1">Ember Sister Official</p>
                      <p>System by. 깔로</p>
                  </footer>
                </main>

                {selectedCount > 0 && (
                  <div className="absolute bottom-0 left-0 right-0 bg-black text-white px-3 sm:px-5 py-4 flex items-center justify-between z-40 shadow-[0_-4px_20px_rgba(0,0,0,0.15)] animate-fade-in">
                    <div className="flex flex-col shrink-0 pr-2">
                      <div className="text-[9px] text-gray-400 tracking-wider mb-0.5">{selectedCount}개 선택됨</div>
                      <div className="text-[15px] sm:text-lg font-bold font-serif tracking-widest">{totalPrice.toLocaleString()}</div>
                    </div>
                    <div className="flex gap-1.5 sm:gap-2 shrink-0">
                      <button onClick={handleCopyAccount} className="px-2 sm:px-3 py-2 border border-gray-600 text-gray-300 text-[10px] font-bold tracking-wider hover:bg-gray-800 transition-colors">계좌복사</button>
                      <button onClick={() => setSelectedNames([])} className="px-2 sm:px-3 py-2 border border-gray-600 text-gray-300 text-[10px] font-bold tracking-wider hover:bg-gray-800 transition-colors">초기화</button>
                      <button onClick={handleCopyAll} className="px-3 sm:px-4 py-2 bg-white text-black text-[10px] sm:text-[12px] font-bold tracking-widest hover:bg-gray-200 transition-colors">전체 복사</button>
                    </div>
                  </div>
                )}

                {showTopBtn && (
                  <button onClick={scrollToTop} className={`absolute right-6 w-11 h-11 bg-black text-white rounded-full shadow-[0_4px_14px_0_rgba(0,0,0,0.39)] flex items-center justify-center animate-fade-in z-30 hover:scale-105 transition-transform ${selectedCount > 0 ? 'bottom-24' : 'bottom-10'}`}>
                    <svg xmlns="http://www.w3.org/2000/svg" className="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2.5}><path strokeLinecap="round" strokeLinejoin="round" d="M5 15l7-7 7 7" /></svg>
                  </button>
                )}

                {toastMessage && (
                  <div className="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 bg-black text-white px-6 py-4 text-[13px] font-bold tracking-widest shadow-2xl z-50 whitespace-nowrap animate-fade-in border border-white/20 rounded-md">
                    {toastMessage}
                  </div>
                )}
                
                {/* 썸네일 클릭 시 확대 보기 모달 */}
                {selectedImage && (
                  <div className="fixed inset-0 z-[100] flex items-center justify-center bg-black bg-opacity-80 p-5 animate-fade-in" onClick={() => setSelectedImage(null)}>
                    <div className="relative max-w-md w-full flex flex-col items-end">
                      <button className="text-white text-3xl font-light hover:text-gray-300 transition-colors mb-2" onClick={() => setSelectedImage(null)}>&times;</button>
                      <img src={selectedImage} className="w-full h-auto max-h-[80vh] object-contain rounded-sm shadow-2xl" onClick={e => e.stopPropagation()} />
                    </div>
                  </div>
                )}

                {/* 관리자 로그인 모달 */}
                {showAuthModal && (
                    <div className="fixed inset-0 z-[100] flex items-center justify-center bg-black/80 backdrop-blur-sm p-5 animate-fade-in">
                        <div className="bg-white p-6 max-w-xs w-full shadow-2xl rounded-sm">
                            <h3 className="font-bold text-lg mb-2">관리자 로그인</h3>
                            <input type="password" value={authInput} onChange={e => setAuthInput(e.target.value)} onKeyDown={e => e.key === 'Enter' && verifyAdmin()} placeholder="비밀번호" className="w-full border border-gray-300 p-2 text-sm mb-4 outline-none focus:border-black" />
                            <div className="flex gap-2">
                                <button onClick={() => setShowAuthModal(false)} className="flex-1 py-2 bg-gray-100 text-gray-600 font-bold text-sm">취소</button>
                                <button onClick={verifyAdmin} className="flex-1 py-2 bg-black text-white font-bold text-sm">확인</button>
                            </div>
                        </div>
                    </div>
                )}

                {/* 사진 등록(크롭퍼) 모달 */}
                {cropTarget && (
                    <CropperModal 
                        product={cropTarget} 
                        onClose={() => setCropTarget(null)} 
                        onSave={handleSaveImage} 
                    />
                )}
                
              </div>
            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<ErrorBoundary><App /></ErrorBoundary>);
    </script>
</body>
</html>
