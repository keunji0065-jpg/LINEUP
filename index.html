    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;1,600&display=swap');
        
        body { 
            font-family: 'Pretendard', sans-serif; 
            background-color: #f8fafc; 
            color: #0f172a; 
        }
        .font-serif { font-family: 'Playfair Display', serif; }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 4px; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in { animation: fadeIn 0.2s ease-out forwards; }

        /* 크롭퍼 캔버스 스타일 */

            width: 100%;
            aspect-ratio: 1 / 1;
            background-color: #0f172a;
            position: relative;
            overflow: hidden;
            touch-action: none;
            cursor: grab;
            border-radius: 8px;
        }
        .crop-canvas-container:active { cursor: grabbing; }
        .crop-canvas-container canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body class="antialiased h-[100dvh] flex flex-col items-center justify-center">

        </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDgdH34cDnp2S9akHfFLYBSpHzzamHFuoc",
            authDomain: "my-live-shop.firebaseapp.com",

            messagingSenderId: "598748133843",

            measurementId: "G-9EX0P6H2Y7"
        };
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.database();

        // YouTube IFrame Player API 스크립트 로드 (영상 현재 재생 위치 실시간 감지용)
        if (!window.YT) {
            const tag = document.createElement('script');
            tag.src = "https://www.youtube.com/iframe_api";
            const firstScriptTag = document.getElementsByTagName('script')[0];
            firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

    <script type="text/babel">
        const { useState, useEffect, useRef, useCallback, useMemo } = React;

        // 특수문자 제거 및 안전한 Firebase Key 생성
        const getSafeKey = (name) => String(name || '').replace(/[.#$\[\]]/g, '_');

        // 현재 시트에 등록된 동일 상품 범위 내에서만 기존 데이터를 안전하게 찾아주는 매칭 헬퍼
        const findMatchingFirebaseEntry = (group, fbData) => {
            if (!fbData || !group) return { key: group?.id, data: {} };

            if (fbData[group.id]) {
                return { key: group.id, data: fbData[group.id] };
            }

            if (group.options && group.options.length > 0) {
                for (const opt of group.options) {
                    const optKey = getSafeKey(opt.originalName);
                    if (fbData[optKey]) {
                        return { key: optKey, data: fbData[optKey] };
                    }
                }
            }

            const groupWords = group.name.trim().split(/\s+/);
            if (groupWords.length >= 2) {
                const fbKeys = Object.keys(fbData).filter(k => k !== '_global_config' && k !== '_live_catalog');
                const subKeyMatch = fbKeys.find(k => k.startsWith(group.id + ' ') || group.id.startsWith(k + ' '));
                if (subKeyMatch && fbData[subKeyMatch]) {
                    return { key: subKeyMatch, data: fbData[subKeyMatch] };
                }
            }

            return { key: group.id, data: {} };
        };

        // 유튜브 URL 또는 ID에서 11자리 영상 ID 추출하는 헬퍼 함수
        const extractYouTubeId = (input) => {
            if (!input) return null;
            const trimmed = String(input).trim();
            if (/^[a-zA-Z0-9_-]{11}$/.test(trimmed)) return trimmed;
            const regExp = /(?:youtube\.com\/(?:[^\/]+\/.+\/|(?:v|e(?:mbed)?|live|shorts)\/|.*[?&]v=)|youtu\.be\/)([^"&?\/\s]{11})/;
            const match = trimmed.match(regExp);
            return match ? match[1] : null;
        };

        // 유튜브 링크에서 t= 파라미터(시작 시간) 자동 추출
        const extractTimeFromUrl = (input) => {
            if (!input) return null;
            const match = String(input).match(/[?&](?:t|start)=([0-9hms]+)/i);
            if (!match) return null;
            const raw = match[1];
            if (/^\d+$/.test(raw)) return formatSecondsToTime(parseInt(raw, 10));
            let totalSec = 0;
            const h = raw.match(/(\d+)h/i);
            const m = raw.match(/(\d+)m/i);
            const s = raw.match(/(\d+)s/i);
            if (h) totalSec += parseInt(h[1], 10) * 3600;
            if (m) totalSec += parseInt(m[1], 10) * 60;
            if (s) totalSec += parseInt(s[1], 10);
            return totalSec > 0 ? formatSecondsToTime(totalSec) : null;
        };

        // 문자열 시간을 항상 양수 초(Seconds) 단위로 안전하게 변환
        const parseTimeToSeconds = (timeStr) => {
            if (timeStr === undefined || timeStr === null || timeStr === '') return null;
            const clean = String(timeStr).trim().replace(/^-+/, '');
            if (!clean) return null;
            if (/^\d+$/.test(clean)) return Math.max(0, parseInt(clean, 10));
            const parts = clean.split(':').map(Number);
            if (parts.some(isNaN)) return null;
            let sec = null;
            if (parts.length === 2) sec = parts[0] * 60 + parts[1];
            else if (parts.length === 3) sec = parts[0] * 3600 + parts[1] * 60 + parts[2];
            return sec !== null ? Math.max(0, Math.floor(sec)) : null;
        };

        // 초(Seconds)를 보기 좋은 "MM:SS" 또는 "HH:MM:SS"로 변환
        const formatSecondsToTime = (sec) => {
            if (sec === null || sec === undefined || isNaN(sec)) return '';
            const total = Math.max(0, Math.floor(Number(sec)));
            const h = Math.floor(total / 3600);
            const m = Math.floor((total % 3600) / 60);
            const s = total % 60;
            if (h > 0) {
                return `${h}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
            }
            return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
        };

        // "-15:20" 또는 "1:00:00 - 38:51" 입력값을 실제 방송 경과 시간(양수)으로 자동 변환
        const resolveVideoTimeInput = (rawInput, liveStartTimestamp, manualTotalTimeStr = '') => {
            if (!rawInput) return { time: '', needsSync: false };
            const clean = String(rawInput).trim();
            if (!clean) return { time: '', needsSync: false };

            const formulaMatch = clean.match(/^([0-9:]+)\s*[-/]\s*([0-9:]+)$/);
            if (formulaMatch && !clean.startsWith('-')) {
                const totalSec = parseTimeToSeconds(formulaMatch[1]) || 0;
                const minusSec = parseTimeToSeconds(formulaMatch[2]) || 0;
                return { time: formatSecondsToTime(Math.max(0, totalSec - minusSec)), needsSync: false, autoSyncedStart: Date.now() - (totalSec * 1000) };
            }

            if (clean.startsWith('-')) {
                const minusSec = parseTimeToSeconds(clean.substring(1));
                if (minusSec === null) return { time: '', needsSync: false };

                if (liveStartTimestamp) {
                    const currentElapsedSec = Math.max(0, Math.floor((Date.now() - liveStartTimestamp) / 1000));
                    const targetSec = Math.max(0, currentElapsedSec - minusSec);
                    return { time: formatSecondsToTime(targetSec), needsSync: false };
                }

                if (manualTotalTimeStr && manualTotalTimeStr.trim()) {
                    const manualTotalSec = parseTimeToSeconds(manualTotalTimeStr.trim());
                    if (manualTotalSec !== null && manualTotalSec > 0) {
                        return { 
                            time: formatSecondsToTime(Math.max(0, manualTotalSec - minusSec)), 
                            needsSync: false,
                            autoSyncedStart: Date.now() - (manualTotalSec * 1000)
                        };
                    }
                }

                return { time: formatSecondsToTime(minusSec), needsSync: true };
            }

            const parsed = parseTimeToSeconds(clean);
            return { time: parsed !== null ? formatSecondsToTime(parsed) : clean, needsSync: false };
        };

        // 1초마다 흐르는 방송 타이머 독립 컴포넌트 (렉 방지)
        const LiveTimerText = ({ liveStartTimestamp }) => {
            const [sec, setSec] = useState(() => liveStartTimestamp ? Math.max(0, Math.floor((Date.now() - liveStartTimestamp) / 1000)) : 0);
            useEffect(() => {
                if (!liveStartTimestamp) { setSec(0); return; }
                const update = () => setSec(Math.max(0, Math.floor((Date.now() - liveStartTimestamp) / 1000)));
                update();
                const id = setInterval(update, 1000);
                return () => clearInterval(id);
            }, [liveStartTimestamp]);
            return <>{formatSecondsToTime(sec)}</>;
        };

        class ErrorBoundary extends React.Component {
            constructor(props) { super(props); this.state = { hasError: false, errorMessage: '' }; }
            static getDerivedStateFromError(error) { return { hasError: true, errorMessage: error.toString() }; }
            componentDidCatch(error, errorInfo) { console.error("오류 발생:", error, errorInfo); }
            render() {
                if (this.state.hasError) {
                    return (
                        <div className="flex flex-col items-center justify-center min-h-screen bg-slate-50 text-center px-5 w-full max-w-md mx-auto">
                            <div className="text-4xl mb-4">⚠️</div>
                            <h2 className="text-lg font-bold mb-2">일시적인 오류가 발생했습니다.</h2>
                            <p className="text-xs text-red-500 mb-6 px-4 break-all">{this.state.errorMessage}</p>
                            <button onClick={() => { localStorage.removeItem('ember_cart_v3'); localStorage.removeItem('ember_grouped_cache_v1'); window.location.reload(); }} className="px-6 py-3 bg-black text-white text-sm font-bold tracking-widest uppercase rounded">새로고침 및 캐시 초기화</button>
                        </div>
                    );
                }
                return this.props.children;
            }
        }

        const SearchIcon = ({ size = 16, className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        );

        const PlayIcon = ({ size = 16, className = "" }) => {
            return <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="currentColor" className={className}><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>;
        };

        // 유튜브 재생바(스크롤) 위치를 실시간으로 읽어오는 스마트 플레이어 컴포넌트 (React DOM 충돌 방지 래퍼 적용)
        const SmartYouTubePlayer = ({ videoId, startSeconds, isLive, playKey, hideControls = false, onTimeUpdate, onDurationChange, onStateChange, onVideoUnavailable, playerRef }) => {
            const wrapperRef = useRef(null);

            useEffect(() => {
                let playerInstance = null;
                let timeCheckInterval = null;
                let isUnmounted = false;

                const wrapperEl = wrapperRef.current;
                if (!wrapperEl) return;

                wrapperEl.innerHTML = '';
                const targetDiv = document.createElement('div');
                targetDiv.style.width = '100%';
                targetDiv.style.height = '100%';
                wrapperEl.appendChild(targetDiv);

                const createPlayer = () => {
                    if (isUnmounted || !window.YT || !window.YT.Player || !wrapperRef.current) return;

                    try {
                        playerInstance = new window.YT.Player(targetDiv, {
                            width: '100%',
                            height: '100%',
                            videoId: videoId,
                            playerVars: {
                                autoplay: 1,
                                playsinline: 1,
                                rel: 0,
                                controls: hideControls ? 0 : 1,
                                modestbranding: 1,
                                iv_load_policy: 3,
                                disablekb: hideControls ? 1 : 0,
                                fs: hideControls ? 0 : 1,
                                start: (!isLive && startSeconds > 0) ? Math.max(0, Math.floor(startSeconds)) : undefined
                            },
                            events: {
                                onReady: (event) => {
                                    if (isUnmounted) return;
                                    if (playerRef) playerRef.current = event.target;
                                    if (!isLive && startSeconds > 0 && event.target.seekTo) {
                                        event.target.seekTo(startSeconds, true);
                                    }
                                    if (onDurationChange && typeof event.target.getDuration === 'function') {
                                        const dur = event.target.getDuration();
                                        if (dur && dur > 0) onDurationChange(Math.floor(dur));
                                    }
                                    timeCheckInterval = setInterval(() => {
                                        try {
                                            if (event.target && typeof event.target.getCurrentTime === 'function') {
                                                const cur = event.target.getCurrentTime();
                                                if (cur && !isNaN(cur) && cur > 0) {
                                                    onTimeUpdate(Math.floor(cur));
                                                }
                                                if (onDurationChange && typeof event.target.getDuration === 'function') {
                                                    const dur = event.target.getDuration();
                                                    if (dur && dur > 0) onDurationChange(Math.floor(dur));
                                                }
                                            }
                                        } catch (err) {}
                                    }, 350);
                                },
                                onStateChange: (event) => {
                                    if (isUnmounted) return;
                                    if (onStateChange) {
                                        onStateChange(event.data === 1);
                                    }
                                    if (onDurationChange && event.target && typeof event.target.getDuration === 'function') {
                                        const dur = event.target.getDuration();
                                        if (dur && dur > 0) onDurationChange(Math.floor(dur));
                                    }
                                },
                                onError: (event) => {
                                    if (isUnmounted) return;
                                    if (onVideoUnavailable) {
                                        onVideoUnavailable(videoId);
                                    }
                                }
                            }
                        });
                    } catch (e) {
                        console.error("YouTube Player 초기화 오류:", e);
                    }
                };

                if (window.YT && window.YT.Player) {
                    createPlayer();
                } else {
                    const prevReady = window.onYouTubeIframeAPIReady;
                    window.onYouTubeIframeAPIReady = () => {
                        if (prevReady) prevReady();
                        createPlayer();
                    };
                }

                return () => {
                    isUnmounted = true;
                    if (timeCheckInterval) clearInterval(timeCheckInterval);
                    if (playerRef) playerRef.current = null;
                    if (playerInstance && typeof playerInstance.destroy === 'function') {
                        try { playerInstance.destroy(); } catch (e) {}
                    }
                    if (wrapperEl) {
                        try { wrapperEl.innerHTML = ''; } catch (e) {}
                    }
                };
            }, [videoId, startSeconds, isLive, playKey, hideControls]);

            return <div ref={wrapperRef} className="w-full h-full"></div>;
        };

        const MediaEditorModal = ({ product, globalYoutubeUrl, liveStartTimestamp, currentData, currentPlayerSec, onClose, onSaveImage, onSaveVideoInfo, onNotify }) => {
            const [tab, setTab] = useState('video');
            const [videoTimeInput, setVideoTimeInput] = useState(currentData?.videoTime || '');
            const [customVideoUrl, setCustomVideoUrl] = useState(currentData?.videoUrl || '');

            const canvasRef = useRef(null);
            const fileInputRef = useRef(null);
            const [imageObj, setImageObj] = useState(null);
            const [scale, setScale] = useState(1);
            const pan = useRef({ x: 0, y: 0 });
            const isDragging = useRef(false);
            const dragStart = useRef({ x: 0, y: 0 });

            const loadImageToCanvas = (src) => {
                const img = new Image();
                img.onload = () => {
                    setImageObj(img);
                    const cSize = 400;
                    const aspect = img.width / img.height;
                    let initialScale = aspect > 1 ? cSize / img.height : cSize / img.width;
                    setScale(initialScale);
                    pan.current = { x: (cSize - img.width * initialScale) / 2, y: (cSize - img.height * initialScale) / 2 };
                    draw();
                };
                img.src = src;
            };

            const handleFileChange = (e) => {
                const file = e.target.files?.[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (evt) => loadImageToCanvas(evt.target.result);
                reader.readAsDataURL(file);
            };

            useEffect(() => {
                const handlePaste = (e) => {
                    if (tab !== 'image') return;
                    const items = (e.clipboardData || e.originalEvent?.clipboardData)?.items || [];
                    let pasted = false;
                    for (const item of items) {
                        if (item.type.indexOf('image') !== -1) {
                            const blob = item.getAsFile();
                            const reader = new FileReader();
                            reader.onload = (evt) => loadImageToCanvas(evt.target.result);
                            reader.readAsDataURL(blob);
                            e.preventDefault();
                            pasted = true;
                            break;
                        }
                    }
                    if (!pasted && items.length > 0 && items[0].type === 'text/plain') {
                        onNotify("클립보드에 이미지가 없습니다. 캡처(Win+Shift+S) 후 붙여넣어주세요!");
                    }
                };
                window.addEventListener('paste', handlePaste);
                return () => window.removeEventListener('paste', handlePaste);
            }, [tab]);

            const draw = useCallback(() => {
                const canvas = canvasRef.current;
                if (!canvas || !imageObj) return;
                const ctx = canvas.getContext('2d');
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.drawImage(imageObj, pan.current.x, pan.current.y, imageObj.width * scale, imageObj.height * scale);
            }, [imageObj, scale]);

            useEffect(() => { if (tab === 'image') draw(); }, [draw, scale, tab]);

            const handleMouseDown = (e) => { if (!imageObj) return; isDragging.current = true; dragStart.current = { x: e.clientX - pan.current.x, y: e.clientY - pan.current.y }; };
            const handleMouseMove = (e) => { if (!isDragging.current) return; pan.current = { x: e.clientX - dragStart.current.x, y: e.clientY - dragStart.current.y }; draw(); };
            const handleMouseUp = () => { isDragging.current = false; };
            
            const handleWheel = (e) => {
                if (!imageObj) return;
                const zoomFactor = e.deltaY < 0 ? 1.05 : 0.95;
                setScale(prev => Math.min(Math.max(prev * zoomFactor, 0.2), 5));
            };

            const handleDrop = (e) => {
                e.preventDefault();
                const file = e.dataTransfer.files?.[0];
                if (file && file.type.startsWith('image/')) {
                    const reader = new FileReader();
                    reader.onload = (evt) => loadImageToCanvas(evt.target.result);
                    reader.readAsDataURL(file);
                }
            };

            const handleSaveCroppedImage = () => {
                if (!imageObj) {
                    onNotify('이미지를 먼저 업로드하거나 붙여넣어주세요.');
                    return;
                }
                const exportCanvas = document.createElement('canvas');
                exportCanvas.width = 800; exportCanvas.height = 800;
                const ctx = exportCanvas.getContext('2d');
                const ratio = 800 / 400; 
                ctx.drawImage(imageObj, pan.current.x * ratio, pan.current.y * ratio, imageObj.width * scale * ratio, imageObj.height * scale * ratio);
                onSaveImage(product.id, exportCanvas.toDataURL('image/jpeg', 0.85));
            };

            const handleUrlOrTimePaste = (val) => {
                const extractedTime = extractTimeFromUrl(val);
                const extractedId = extractYouTubeId(val);
                if (extractedId && val.includes('http')) {
                    setCustomVideoUrl(val.trim());
                    if (extractedTime && !videoTimeInput) {
                        setVideoTimeInput(extractedTime);
                    }
                } else {
                    setCustomVideoUrl(val);
                }
            };

            const handleSaveVideo = () => {
                const { time: resolvedTime, needsSync, autoSyncedStart } = resolveVideoTimeInput(videoTimeInput, liveStartTimestamp);
                if (needsSync) {
                    onNotify("⚠️ 상단 노란 칸에 [현재 방송 경과시간]을 딱 한 번만 먼저 적어주세요!");
                    return;
                }
                if (autoSyncedStart && !liveStartTimestamp) {
                    db.ref('ember_live_data/_global_config/liveStartTimestamp').set(autoSyncedStart);
                }
                onSaveVideoInfo(product.id, {
                    videoTime: resolvedTime,
                    videoUrl: customVideoUrl.trim()
                });
            };

            const handleClearVideo = () => {
                onSaveVideoInfo(product.id, {
                    videoTime: '',
                    videoUrl: ''
                });
            };

            const previewYtId = extractYouTubeId(customVideoUrl) || extractYouTubeId(globalYoutubeUrl);

            return (
                <div className="fixed inset-0 z-[100] flex items-center justify-center bg-slate-900/80 backdrop-blur-sm p-4 animate-fade-in">
                    <div className="bg-white max-w-sm w-full p-5 shadow-2xl rounded-xl flex flex-col">
                        <div className="flex justify-between items-center mb-3">
                            <h3 className="font-bold text-sm truncate pr-2">미디어 설정: {product.name}</h3>
                            <button onClick={onClose} className="text-2xl text-slate-400 hover:text-black leading-none">&times;</button>
                        </div>

                        <div className="flex bg-slate-100 p-1 rounded-lg mb-4">
                            <button 
                                onClick={() => setTab('video')} 
                                className={`flex-1 py-1.5 text-xs font-bold rounded-md transition ${tab === 'video' ? 'bg-black text-white shadow-sm' : 'text-slate-600'}`}
                            >
                                🎬 영상/다시보기 연결
                            </button>
                            <button 
                                onClick={() => setTab('image')}

        };

        function App() {
          const [groupedProducts, setGroupedProducts] = useState([]); 
          const [firebaseData, setFirebaseData] = useState({});
          
          const [searchTerm, setSearchTerm] = useState("");
          const [toastMessage, setToastMessage] = useState("");
          
          const [isInitialLoad, setIsInitialLoad] = useState(true); 
          const [isRefreshing, setIsRefreshing] = useState(false);
          
          const [selectedImage, setSelectedImage] = useState(null);
          const [refreshKey, setRefreshKey] = useState(0);
          
          const [isAdmin, setIsAdmin] = useState(false);
          const [showAuthModal, setShowAuthModal] = useState(false);
          const [authInput, setAuthInput] = useState("");
          const [mediaModalTarget, setMediaModalTarget] = useState(null); 
          const [activeTab, setActiveTab] = useState('catalog');
          
          const [viewMode, setViewMode] = useState('image');

          const [activeVideo, setActiveVideo] = useState(null); 
          const [playerLayout, setPlayerLayout] = useState('floating'); 
          const [currentPlayerSec, setCurrentPlayerSec] = useState(0);
          const [playerDuration, setPlayerDuration] = useState(0);
          const [isPlayerPlaying, setIsPlayerPlaying] = useState(true);
          const [hideYoutubeUi, setHideYoutubeUi] = useState(true);
          const ytPlayerRef = useRef(null);
          const html5VideoRef = useRef(null);
          const playerViewportRef = useRef(null);
          const cropOverlayRef = useRef(null);
          const screenStreamRef = useRef(null);
          const screenVideoRef = useRef(null);
          const [isAutoCaptureReady, setIsAutoCaptureReady] = useState(false);

          const [cropBox, setCropBox] = useState({ x: 50, y: 50, size: 100 });
          const [isInteractiveCrop, setIsInteractiveCrop] = useState(false);
          const [showLiveChat, setShowLiveChat] = useState(true);
          const [chatDarkBg, setChatDarkBg] = useState(true);
          const [chatWidth, setChatWidth] = useState(260);
          const [isResizingChat, setIsResizingChat] = useState(false);
          const chatResizeRef = useRef({ active: false, startX: 0, startWidth: 260 });
          const cropDragRef = useRef({ active: false, startX: 0, startY: 0, origX: 50, origY: 50 });

          useEffect(() => {
              const handleMouseMove = (e) => {
                  if (!chatResizeRef.current.active) return;
                  const deltaX = chatResizeRef.current.startX - e.clientX;
                  const nextW = Math.min(480, Math.max(190, chatResizeRef.current.startWidth + deltaX));
                  setChatWidth(nextW);
              };
              const handleMouseUp = () => {
                  if (chatResizeRef.current.active) {
                      chatResizeRef.current.active = false;
                      setIsResizingChat(false);
                  }
              };
              window.addEventListener('mousemove', handleMouseMove);
              window.addEventListener('mouseup', handleMouseUp);
              return () => {
                  window.removeEventListener('mousemove', handleMouseMove);
                  window.removeEventListener('mouseup', handleMouseUp);
              };
          }, []);

          const [globalYoutubeInput, setGlobalYoutubeInput] = useState("");
          const [manualTotalTime, setManualTotalTime] = useState(""); 
          const [isAdminPanelOpen, setIsAdminPanelOpen] = useState(false);
          const [confirmResetAll, setConfirmResetAll] = useState(false);
          const [unavailableYtIds, setUnavailableYtIds] = useState({});
          const [selectedPreCapId, setSelectedPreCapId] = useState(null);
          
          const adminClickCount = useRef(0);
          const adminTimer = useRef(null);

          const [selectedOptions, setSelectedOptions] = useState(() => {
            try { 
                const saved = localStorage.getItem('ember_cart_v3'); 
                const parsed = saved ? JSON.parse(saved) : []; 
                return Array.isArray(parsed) ? parsed : []; 
            } 
            catch (e) { return []; }
          });

          useEffect(() => { localStorage.setItem('ember_cart_v3', JSON.stringify(selectedOptions)); }, [selectedOptions]);

          const showToast = useCallback((message) => {
              setToastMessage(message);
              setTimeout(() => setToastMessage(""), 2200);
          }, []);

          const maxKnownOptionsCount = useRef(0);
          const isAdminRef = useRef(false);
          const isStoreClosedRef = useRef(true);
          const isConfigLoadedRef = useRef(false);
          const lastFirebaseCatalogTimeRef = useRef(0);

          useEffect(() => {
              isAdminRef.current = isAdmin;
          }, [isAdmin]);

          const parseRawItemsToGroups = useCallback((validRows) => {
              // 상품명에서 고유 그룹 키 추출 (예: "01 코트" -> "01", "E 85-1 귀걸이" -> "E 85-1_39000", "N 52 목걸이" -> "N 52_45000")
              const extractItemGroupKey = (name, price) => {
                  const trimmed = String(name || '').trim();
                  // 1) 숫자로 시작하는 경우: "85-1 ...", "01 ..."
                  const numStart = trimmed.match(/^(\d+(?:-\d+)?)/);
                  if (numStart) return `${numStart[1]}_${price}`;
                  // 2) 영문코드 + 공백 + 숫자로 시작하는 경우: "E 85-1 ...", "N 52 ...", "A-102 ..."
                  const prefixNum = trimmed.match(/^([a-zA-Z]+\s*\d+(?:-\d+)?)/);
                  if (prefixNum) return `${prefixNum[1].replace(/\s+/g, '').toUpperCase()}_${price}`;
                  // 3) 그 외 일반 상품명: 앞 2단어 + 가격 기준
                  const words = trimmed.split(/\s+/);
                  const baseKey = words.length >= 2 ? `${words[0]}_${words[1]}` : words[0];
                  return `${baseKey}_${price}`;
              };

              const groupMap = {};
              validRows.forEach(row => {
                  const groupKey = extractItemGroupKey(row.originalName, row.numericPrice);
                  if (!groupMap[groupKey]) groupMap[groupKey] = [];
                  groupMap[groupKey].push(row);
              });

              const finalGroups = [];
              for (const key in groupMap) {
                  const items = groupMap[key];
                  if (items.length === 1) {
                      finalGroups.push({
                          id: getSafeKey(items[0].originalName),
                          name: items[0].originalName,
                          formattedPrice: items[0].formattedPrice,
                          numericPrice: items[0].numericPrice,
                          sheetVideoCol: items[0].sheetVideoCol || '',
                          options: [{
                              originalName: items[0].originalName,
                              displayName: '기본(단품)',
                              isSoldOut: items[0].isSoldOut,
                              numericPrice: items[0].numericPrice
                          }]
                      });
                      continue;
                  }

                  const splitItems = items.map(item => item.originalName.split(/\s+/));
                  const minLen = Math.min(...splitItems.map(arr => arr.length));
                  let commonWordCount = 0;
                  for (let i = 0; i < minLen; i++) {
                      const word = splitItems[0][i];
                      if (splitItems.every(arr => arr[i] === word)) commonWordCount++;
                      else break;
                  }

                  // 만약 공통 단어가 아예 없거나 영문 1글자('E', 'N' 등)뿐이라면 억지로 묶지 않고 개별 단품으로 분리!
                  const commonPrefixStr = splitItems[0].slice(0, commonWordCount).join(' ').trim();
                  if (commonWordCount === 0 || /^[a-zA-Z]$/.test(commonPrefixStr)) {
                      items.forEach(singleItem => {
                          finalGroups.push({
                              id: getSafeKey(singleItem.originalName),
                              name: singleItem.originalName,
                              formattedPrice: singleItem.formattedPrice,
                              numericPrice: singleItem.numericPrice,
                              sheetVideoCol: singleItem.sheetVideoCol || '',
                              options: [{
                                  originalName: singleItem.originalName,
                                  displayName: '기본(단품)',
                                  isSoldOut: singleItem.isSoldOut,
                                  numericPrice: singleItem.numericPrice
                              }]
                          });
                      });
                      continue;
                  }

                  const baseName = commonPrefixStr;
                  const safeKey = getSafeKey(baseName);
                  const options = items.map((item, idx) => ({
                      originalName: item.originalName,
                      displayName: splitItems[idx].slice(commonWordCount).join(' ') || '기본(단품)',
                      isSoldOut: item.isSoldOut,
                      numericPrice: item.numericPrice
                  }));

                  finalGroups.push({
                      id: safeKey,
                      name: baseName,
                      formattedPrice: items[0].formattedPrice,
                      numericPrice: items[0].numericPrice,
                      sheetVideoCol: items[0].sheetVideoCol || '',
                      options: options
                  });
              }

              return finalGroups.sort((a, b) => {
                  const matchA = a.name.match(/^(?:[a-zA-Z]+\s*)?(\d+)(?:-(\d+))?/);
                  const matchB = b.name.match(/^(?:[a-zA-Z]+\s*)?(\d+)(?:-(\d+))?/);
                  const numA = matchA ? parseInt(matchA[1], 10) : -1;
                  const numB = matchB ? parseInt(matchB[1], 10) : -1;
                  if (numA === -1 && numB === -1) return a.name.localeCompare(b.name);
                  if (numA !== numB) return numB - numA;
                  const subA = matchA && matchA[2] ? parseInt(matchA[2], 10) : 0;
                  const subB = matchB && matchB[2] ? parseInt(matchB[2], 10) : 0;
                  return subB - subA;
              });
          }, []);

          const fetchSheetData = useCallback(async (isManualRefresh = false) => {
              if (!isConfigLoadedRef.current) {
                  try {
                      const cfgSnap = await db.ref('ember_live_data/_global_config').once('value');
                      const cfgVal = cfgSnap.val() || {};
                      const closedCheck = Boolean(cfgVal.catalogClosedLock !== undefined ? cfgVal.catalogClosedLock : cfgVal.isStoreClosed);
                      isStoreClosedRef.current = closedCheck;
                      isConfigLoadedRef.current = true;
                  } catch (e) {}
              }
              if (isStoreClosedRef.current && !isAdminRef.current) {
                  setGroupedProducts([]);
                  setIsInitialLoad(false);
                  setIsRefreshing(false);
                  return;
              }
              if (!isManualRefresh && lastFirebaseCatalogTimeRef.current > 0 && (Date.now() - lastFirebaseCatalogTimeRef.current < 15000)) {
                  setIsInitialLoad(false);
                  setIsRefreshing(false);
                  return;
              }

              setIsRefreshing(true);
              
              try {
                const GAS_URL = 'https://script.google.com/macros/s/AKfycbwBjZG8rSPi129Jr2Et_4008ZU8Q_SH3Q0rI0ls1Wt9SYD7J47NlG3bgY2FZ6Hl7b_e/exec';
                const MASTER_ID = '1B8SBMX18_Px1CpRHuDTxqodqudiTrf6NfVoptjHtnGQ';
                let validRows = [];
                let loadedFromGas = false;

                // 1순위: 캐시 딜레이가 전혀 없는 구글 앱스 스크립트(실시간재고 시트 직접 읽기) 호출
                try {
                    const gasRes = await fetch(`${GAS_URL}?action=get_all&masterId=${MASTER_ID}&t=${Date.now()}`, { cache: 'no-store' });
                    if (gasRes.ok) {
                        const gasJson = await gasRes.json();
                        if (gasJson && (gasJson.status === 'success' || gasJson.success) && Array.isArray(gasJson.inventory)) {
                            loadedFromGas = true;
                            gasJson.inventory.forEach(item => {
                                const name = String(item.name || item['상품명'] || item.col_0 || '').trim();
                                const priceRaw = item.price !== undefined ? item.price : (item['단가'] !== undefined ? item['단가'] : item.col_1);
                                const priceNum = parseInt(String(priceRaw || '0').replace(/[^0-9-]/g, ''), 10);
                                const statusStr = String(item.status || item['상태'] || item.col_3 || '').trim();
                                if (name && name.toLowerCase() !== 'name' && name !== '상품명' && !isNaN(priceNum) && priceNum > 0) {
                                    validRows.push({
                                        originalName: name,
                                        isSoldOut: statusStr === '품절' || Boolean(item.isSoldOut),
                                        numericPrice: priceNum,
                                        formattedPrice: priceNum.toLocaleString(),
                                        sheetVideoCol: ''
                                    });
                                }
                            });
                        }
                    }
                } catch (gasErr) {}

                // 2순위 폴백: GAS에서 0건이거나 통신 실패 시에만 기존 CSV 링크 보조 사용
                if (!loadedFromGas || validRows.length === 0) {
                    const cacheBuster = Date.now();
                    const csvUrl = `https://docs.google.com/spreadsheets/d/e/2PACX-1vRI6cW1MyLv5gbcfsjEyYuMDWdL6jDit_Fuz2ZNXPKwEJZeedXoNorHHhUdsoDnDxBzzrFu6P72WVOy/pub?gid=1797935796&single=true&output=csv&_cb=${cacheBuster}`;
                    const response = await fetch(csvUrl, { cache: 'no-store' });
                    if (response.ok) {
                        const text = await response.text();
                        if (!text.trim().startsWith('<!DOCTYPE') && !text.trim().startsWith('<html')) {
                            const rows = text.replace(/\r/g, '').split('\n');
                            rows.forEach((row) => {
                                const cleanRow = row.trim();
                                if (!cleanRow) return;
                                const cols = []; let current = ''; let inQuotes = false;
                                for (let i = 0; i < cleanRow.length; i++) {
                                    if (cleanRow[i] === '"') inQuotes = !inQuotes;
                                    else if (cleanRow[i] === ',' && !inQuotes) { cols.push(current.trim()); current = ''; }
                                    else current += cleanRow[i];
                                }
                                cols.push(current.trim());
                                if (cols[0]) {
                                    const firstColLower = String(cols[0]).toLowerCase();
                                    if (firstColLower !== "name" && firstColLower !== "price" && firstColLower !== "상품명") {
                                        const rawPrice = cols[1] ? String(cols[1]).trim() : '';
                                        const numOnly = rawPrice.replace(/[^0-9-]/g, '');
                                        const priceNum = parseInt(numOnly, 10);
                                        const sheetVideoCol = cols[3] ? String(cols[3]).trim() : '';
                                        if (rawPrice !== '-' && !(priceNum <= 0)) {
                                            validRows.push({
                                                originalName: String(cols[0]).trim(),
                                                isSoldOut: cols[2] ? String(cols[2]).trim() === '품절' : false,
                                                numericPrice: isNaN(priceNum) ? 0 : priceNum,
                                                formattedPrice: isNaN(priceNum) ? rawPrice : priceNum.toLocaleString(),
                                                sheetVideoCol: sheetVideoCol
                                            });
                                        }
                                    }
                                }
                            });
                        }
                    }
                }

                if (isStoreClosedRef.current && !isAdminRef.current) {
                    setGroupedProducts([]);
                    setIsInitialLoad(false);
                    setIsRefreshing(false);
                    return;
                }

                const groupArray = parseRawItemsToGroups(validRows);
                const currentTotalOptions = validRows.length;

                if (groupArray.length === 0) {
                    // 🛡️ 방어막: 시트에서 일시적으로 0건이 읽히더라도 기존에 불러온 라인업(또는 Firebase 미러)이 있다면 절대 지우지 않고 유지합니다!
                    setIsInitialLoad(false);
                    setIsRefreshing(false);
                    return;
                }

                setGroupedProducts(prev => {
                    if (!isManualRefresh && !loadedFromGas && maxKnownOptionsCount.current > 0 && currentTotalOptions < maxKnownOptionsCount.current) {
                        return prev;
                    }
                    if (currentTotalOptions >= maxKnownOptionsCount.current || isManualRefresh || loadedFromGas) {
                        maxKnownOptionsCount.current = currentTotalOptions;
                    }
                    const prevJson = JSON.stringify(prev);
                    const nextJson = JSON.stringify(groupArray);
                    if (prevJson !== nextJson) {
                        if (isAdminRef.current && !isStoreClosedRef.current) {
                            db.ref('ember_live_data/_live_catalog').set({ items: groupArray, updatedAt: Date.now() }).catch(() => {});
                        }
                        return groupArray;
                    }
                    return prev;
                });

                const allValidOptions = groupArray.flatMap(g => g.options.map(o => o.originalName));
                setSelectedOptions(prev => (Array.isArray(prev) ? prev : []).filter(name => allValidOptions.includes(name)));
                
                setIsInitialLoad(false);
                setIsRefreshing(false);
              } catch (error) {
                console.error("데이터 로드 실패:", error);
                setIsInitialLoad(false);
                setIsRefreshing(false);
              }
          }, [parseRawItemsToGroups]);

          useEffect(() => {
              try { localStorage.removeItem('ember_grouped_cache_v1'); } catch (e) {}
          }, []);

          useEffect(() => {
              fetchSheetData(refreshKey > 0);
          }, [refreshKey, fetchSheetData]);

          useEffect(() => {
              const autoRefreshTimer = setInterval(() => {
                  if (!document.hidden && !isStoreClosedRef.current) {
                      fetchSheetData(false);
                  }
              }, 15000);
              return () => clearInterval(autoRefreshTimer);
          }, [fetchSheetData]);

          useEffect(() => {
              const ref = db.ref('ember_live_data');
              ref.on('value', (snap) => {
                  const val = snap.val() || {};
                  setFirebaseData(val);
                  if (val._global_config?.youtubeUrl !== undefined) {
                      setGlobalYoutubeInput(val._global_config.youtubeUrl);
                  }
                  const closedNow = Boolean(
                      val._global_config?.catalogClosedLock !== undefined
                          ? val._global_config.catalogClosedLock
                          : val._global_config?.isStoreClosed
                  );
                  isStoreClosedRef.current = closedNow;
                  isConfigLoadedRef.current = true;

                  if (closedNow) {
                      setSelectedOptions([]);
                      try { localStorage.removeItem('ember_cart_v3'); } catch (e) {}
                      if (!isAdminRef.current) {
                          setGroupedProducts([]);
                      }
                      setIsInitialLoad(false);
                      return;
                  } else if (val._live_catalog !== undefined) {
                      const mirrorItems = Array.isArray(val._live_catalog.items) ? val._live_catalog.items : [];

                      const hasBrokenSingleLetterGroup = mirrorItems.some(g => /^[a-zA-Z]$/.test(String(g.name || '').trim()));

          }, [fetchSheetData]);

          const rawGlobalYoutubeUrl = firebaseData._global_config?.youtubeUrl || "";

          const checkYouTubeVideoPublic = useCallback((ytId) => {

              fetch(`https://noembed.com/embed?url=https://www.youtube.com/watch?v=${ytId}`)

                      } else {
                          markAvailable();
                      }

                  .catch(() => {
                      const img = new Image();
                      img.onload = () => {

          const handleSeekRelative = (deltaSec) => {

              } else if (html5VideoRef.current) {
                  const nextSec = Math.max(0, html5VideoRef.current.currentTime + deltaSec);
                  html5VideoRef.current.currentTime = nextSec;
                  setCurrentPlayerSec(Math.floor(nextSec));
              }
          };

          const handleTogglePlayPause = () => {
              if (ytPlayerRef.current && typeof ytPlayerRef.current.getPlayerState === 'function') {
                  const state = ytPlayerRef.current.getPlayerState();
                  if (state === 1) {
                      ytPlayerRef.current.pauseVideo();

                  } else {
                      ytPlayerRef.current.playVideo();
                      setIsPlayerPlaying(true);

              } else if (html5VideoRef.current) {

              }
          };

          const handleSeekToAbsolute = (targetSec) => {

                  ytPlayerRef.current.seekTo(sec, true);
              } else if (html5VideoRef.current) {
                  html5VideoRef.current.currentTime = sec;
              }
          };

          const cropSourceCenterSquare = (sourceEl, sx, sy, sw, sh) => {
              const side = Math.min(sw, sh);
              const cropX = sx + (sw - side) / 2;
              const cropY = sy + (sh - side) / 2;
              const canvas = document.createElement('canvas');
              canvas.width = 800;
              canvas.height = 800;
              const ctx = canvas.getContext('2d');
              ctx.drawImage(sourceEl, cropX, cropY, side, side, 0, 0, 800, 800);
              return canvas.toDataURL('image/jpeg', 0.85);
          };

          const ensureScreenCaptureStream = async () => {
              if (screenStreamRef.current && screenStreamRef.current.active && screenVideoRef.current) {
                  return screenVideoRef.current;
              }
              if (!navigator.mediaDevices || !navigator.mediaDevices.getDisplayMedia) {
                  return null;
              }
              try {
                  const stream = await navigator.mediaDevices.getDisplayMedia({
                      video: {
                          displaySurface: 'browser',
                          cursor: 'never'
                      },
                      audio: false,
                      preferCurrentTab: true
                  });
                  screenStreamRef.current = stream;
                  const video = document.createElement('video');
                  video.srcObject = stream;
                  video.muted = true;
                  video.playsInline = true;
                  await video.play();
                  screenVideoRef.current = video;
                  setIsAutoCaptureReady(true);

                  stream.getVideoTracks()[0].addEventListener('ended', () => {
                      screenStreamRef.current = null;
                      screenVideoRef.current = null;
                      setIsAutoCaptureReady(false);
                  });

                  await new Promise(r => setTimeout(r, 250));
                  return video;
              } catch (err) {
                  console.warn("화면 자동 캡처 권한 취소됨:", err);
                  return null;
              }
          };

          const captureCurrentPlayerCenterSquare = async () => {
              const viewportEl = playerViewportRef.current;
              if (!viewportEl) return null;

              const rect = viewportEl.getBoundingClientRect();
              if (rect.width < 20 || rect.height < 20) return null;

              const baseSide = Math.min(rect.width, rect.height);
              const boxSidePx = baseSide * (cropBox.size / 100);
              const maxOffsetX = Math.max(0, rect.width - boxSidePx);
              const maxOffsetY = Math.max(0, rect.height - boxSidePx);
              const localLeft = (cropBox.x / 100) * maxOffsetX;
              const localTop = (cropBox.y / 100) * maxOffsetY;

              if (html5VideoRef.current && html5VideoRef.current.videoWidth > 0) {
                  try {
                      const v = html5VideoRef.current;
                      const scaleX = v.videoWidth / rect.width;
                      const scaleY = v.videoHeight / rect.height;
                      const canvas = document.createElement('canvas');
                      canvas.width = 800;
                      canvas.height = 800;
                      const ctx = canvas.getContext('2d');
                      ctx.drawImage(
                          v,
                          localLeft * scaleX,
                          localTop * scaleY,
                          boxSidePx * scaleX,
                          boxSidePx * scaleY,
                          0, 0, 800, 800
                      );
                      return canvas.toDataURL('image/jpeg', 0.88);
                  } catch (e) {}
              }

              const capVideo = await ensureScreenCaptureStream();
              if (!capVideo || !capVideo.videoWidth) return null;

              let wasPausedBeforeCapture = false;
              let wasMutedBeforeCapture = false;
              try {
                  if (ytPlayerRef.current && typeof ytPlayerRef.current.getPlayerState === 'function') {
                      const st = ytPlayerRef.current.getPlayerState();
                      if (st !== 1) {
                          wasPausedBeforeCapture = true;
                          wasMutedBeforeCapture = ytPlayerRef.current.isMuted ? ytPlayerRef.current.isMuted() : false;
                          if (ytPlayerRef.current.mute) ytPlayerRef.current.mute();
                          if (ytPlayerRef.current.playVideo) ytPlayerRef.current.playVideo();
                      }
                  }
              } catch (e) {}

              if (cropOverlayRef.current) {
                  cropOverlayRef.current.style.opacity = '0';
              }

              const waitMs = wasPausedBeforeCapture ? 320 : 60;
              await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(() => setTimeout(r, waitMs))));

              const scaleX = capVideo.videoWidth / window.innerWidth;
              const scaleY = capVideo.videoHeight / window.innerHeight;

              const sx = (rect.left + localLeft) * scaleX;
              const sy = (rect.top + localTop) * scaleY;
              const sw = boxSidePx * scaleX;
              const sh = boxSidePx * scaleY;

              const canvas = document.createElement('canvas');
              canvas.width = 800;
              canvas.height = 800;
              const ctx = canvas.getContext('2d');
              ctx.drawImage(capVideo, sx, sy, sw, sh, 0, 0, 800, 800);

              if (cropOverlayRef.current) {
                  cropOverlayRef.current.style.opacity = '1';
              }

              if (wasPausedBeforeCapture && ytPlayerRef.current) {

              const maxOffsetX = Math.max(1, rect.width - boxSidePx);
              const maxOffsetY = Math.max(1, rect.height - boxSidePx);

              const dx = e.clientX - cropDragRef.current.startX;
              const dy = e.clientY - cropDragRef.current.startY;

              const nextX = Math.min(100, Math.max(0, cropDragRef.current.origX + (dx / maxOffsetX) * 100));

                                                <div className="flex justify-between whitespace-nowrap">
                                                    <span>🔍 확대</span>
                                                    <span className="text-amber-300 font-bold">{Math.round(10000 / cropBox.size)}%</span>
                                                </div>
                                                <input 
                                                    type="range" min="35" max="100" value={135 - cropBox.size}
                                                    onChange={(e) => setCropBox(prev => ({ ...prev, size: 135 - Number(e.target.value) }))}
                                                    className="w-full accent-amber-400 cursor-pointer h-1.5"
                                                />
                                            </div>
                                            <div className="flex flex-col gap-0.5 min-w-0">
                                                <div className="flex justify-between whitespace-nowrap">
                                                    <span>↔ 좌우</span>
                                                    <span className="text-amber-300 font-bold">{Math.round(cropBox.x)}%</span>
                                                </div>
                                                <input 
                                                    type="range" min="0" max="100" value={cropBox.x}
                                                    onChange={(e) => setCropBox(prev => ({ ...prev, x: Number(e.target.value) }))}
                                                    className="w-full accent-amber-400 cursor-pointer h-1.5"
                                                />
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            {showLiveChat && (
                                <div
                                    onMouseDown={(e) => {
                                        e.preventDefault();
                                        chatResizeRef.current = { active: true, startX: e.clientX, startWidth: chatWidth };
                                        setIsResizingChat(true);
                                    }}
                                    title="마우스로 잡고 좌우로 끌어서 채팅창과 영상 크기를 조절하세요!"
                                    className={`w-2 hover:w-2.5 h-full cursor-col-resize flex items-center justify-center shrink-0 transition-colors z-30 ${
                                        isResizingChat ? 'bg-amber-400' : 'bg-slate-800 hover:bg-amber-400/80'
                                    }`}
                                >
                                    <div className="w-0.5 h-10 bg-slate-400 rounded-full pointer-events-none" />
                                </div>
                            )}

                            {showLiveChat && (
                                <div 
                                    style={{ width: `${chatWidth}px` }}
                                    className="h-full bg-[#0f0f0f] flex flex-col shrink-0"
                                >
                                    <div className="px-2 py-1.5 bg-slate-950 border-b border-slate-800 flex items-center justify-between text-xs gap-1">
                                        <div className="flex items-center gap-1 min-w-0">
                                            <span className="w-2 h-2 rounded-full bg-emerald-400 shrink-0"></span>
                                            <span className="font-bold text-slate-200 text-[11px] truncate">채팅</span>
                                            <div className="flex bg-slate-900 rounded border border-slate-700 overflow-hidden ml-1 shrink-0">
                                                <button
                                                    type="button"
                                                    onClick={() => setChatWidth(210)}
                                                    className={`px-1.5 py-0.5 text-[9px] font-bold ${chatWidth <= 220 ? 'bg-amber-400 text-black' : 'text-slate-400 hover:text-white'}`}
                                                    title="채팅창 아주 작게"
                                                >
                                                    작게
                                                </button>
                                                <button
                                                    type="button"
                                                    onClick={() => setChatWidth(260)}
                                                    className={`px-1.5 py-0.5 text-[9px] font-bold ${chatWidth > 220 && chatWidth <= 300 ? 'bg-amber-400 text-black' : 'text-slate-400 hover:text-white'}`}
                                                    title="채팅창 적당하게"
                                                >
                                                    보통
                                                </button>
                                                <button
                                                    type="button"
                                                    onClick={() => setChatWidth(350)}
                                                    className={`px-1.5 py-0.5 text-[9px] font-bold ${chatWidth > 300 ? 'bg-amber-400 text-black' : 'text-slate-400 hover:text-white'}`}
                                                    title="채팅창 넓게"
                                                >
                                                    넓게
                                                </button>
                                            </div>
                                        </div>
                                        <div className="flex items-center gap-1 shrink-0">
                                            <button
                                                type="button"
                                                onClick={() => setChatDarkBg(prev => !prev)}
                                                className="px-1.5 py-0.5 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded text-[10px] font-bold border border-slate-700 transition"
                                                title="채팅 글씨 색상에 맞춰 배경을 검정색 또는 흰색으로 바꿉니다"
                                            >
                                                {chatDarkBg ? '🌙' : '☀️'}
                                            </button>
                                            {currentStudioVideoId && (
                                                <a
                                                    href={`https://www.youtube.com/live_chat?is_popout=1&v=${currentStudioVideoId}`}
                                                    target="_blank"
                                                    rel="noopener noreferrer"
                                                    className="px-1.5 py-0.5 bg-slate-800 hover:bg-slate-700 text-amber-300 rounded text-[10px] font-bold border border-slate-700 transition"
                                                    title="새 팝업창으로 띄우기"
                                                >
                                                    ↗
                                                </a>
                                            )}
                                        </div>
                                    </div>

                                    {currentStudioVideoId ? (
                                        <div 
                                            style={{ backgroundColor: chatDarkBg ? '#0f0f0f' : '#ffffff', colorScheme: chatDarkBg ? 'dark' : 'light' }}
                                            className="flex-1 relative flex flex-col transition-colors overflow-hidden"
                                        >
                                            {(() => {
                                                const baseChatWidth = 320;
                                                const chatScale = chatWidth < baseChatWidth ? (chatWidth / baseChatWidth) : 1;
                                                return (
                                                    <div className="flex-1 relative w-full h-full overflow-hidden">
                                                        <iframe
                                                            key={`chat_${currentStudioVideoId}_${embedDomain}_${chatDarkBg ? 'dark' : 'light'}`}
                                                            src={`https://www.youtube.com/live_chat?v=${currentStudioVideoId}&embed_domain=${embedDomain}&dark_theme=${chatDarkBg ? 1 : 0}`}
                                                            style={{ 
                                                                backgroundColor: chatDarkBg ? '#0f0f0f' : '#ffffff', 
                                                                colorScheme: chatDarkBg ? 'dark' : 'light',
                                                                width: chatScale < 1 ? `${baseChatWidth}px` : '100%',
                                                                height: chatScale < 1 ? `${100 / chatScale}%` : '100%',
                                                                transform: chatScale < 1 ? `scale(${chatScale})` : 'none',
                                                                transformOrigin: 'top left'
                                                            }}
                                                            className="border-0 block"
                                                            title="YouTube Live Chat"
                                                        />
                                                    </div>
                                                );
                                            })()}
                                            <div className="bg-slate-950 px-2 py-1 text-[9px] text-slate-400 border-t border-slate-800 leading-tight shrink-0">
                                                💡 글씨가 안 보이면 상단 <b>[🌙/☀️]</b> 버튼으로 배경색 반전!
                                            </div>
                                        </div>
                                    ) : (
                                        <div className="flex-1 flex flex-col items-center justify-center text-slate-500 p-6 text-center text-xs bg-[#0f0f0f]">
                                            <div className="text-3xl mb-2">💬</div>
                                            <p className="font-bold text-slate-300 mb-1">유튜브 영상을 먼저 연동해주세요</p>
                                            <p className="text-[11px] text-slate-500">라이브 방송 주소를 등록하면 이곳에 실시간 채팅창이 나란히 표시됩니다.</p>
                                        </div>
                                    )}
                                </div>
                            )}
                        </div>
                    </div>
                )}
            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<ErrorBoundary><App /></ErrorBoundary>);
    </script>
</body>
</html>
